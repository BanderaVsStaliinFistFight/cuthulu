 eldritch_forbidden_rites:0 "The Forbidden Rites"
 eldritch_forbidden_rites_desc:0 "Beneath the cities of men, beneath the seas, and in the spaces between the stars, things older than humanity wait. They do not care for flags or ideologies, but they can be bargained with.\n\n§RPatron:§! §R[ROOT.GetEldritchGodName]§!\n§RPact:§! [ROOT.GetEldritchPactStage]\n[ROOT.GetEldritchFavorLine]\n[ROOT.GetEldritchProphetLine]\n[ROOT.GetEldritchMantleLine]"

 eldritch_prophet_path:0 "The Prophet's Path"
 eldritch_prophet_path_desc:0 "The rites have taught the Prophet more than any one life should hold. Spend Insight here to walk one of three paths, or a little of each.\n\n§RInsight to spend:§! §G[?eldritch_prophet_insight|0]§!\n§RPaths:§! Lore §R[?eldritch_path_lore|0]§!/3, Zeal §R[?eldritch_path_zeal|0]§!/3, Will §R[?eldritch_path_will|0]§!/3\n\nEach perk costs a point of Insight and needs its stat at 2, 4 or 6, and the perk before it. Insight also raises stats, so choose carefully."

