 ################################################################
 # EVENTS
 ################################################################

 eldritch.1.t:0 "The Forbidden Lore"
 eldritch.1.d:0 "Our agents have come back. Three of the five who went, anyway, and one of those three has not stopped whispering since. They brought a book: a thick, crumbling volume whose pages feel warm to the touch, its margins crowded with notes in a dozen hands and a dozen languages.\n\nThe translators worked in shifts so that no one read too much at once. What they found were rituals. Six of them, each one calling something vast and old that has waited since before the first human looked at the stars.\n\nThe book is clear on one point above all: a nation can be bound to only one of them."
 eldritch.1.a:0 "That is not dead which can eternal lie..."

 eldritch.11.t:0 "Cthulhu Answers"
 eldritch.11.d:0 "On the sixtieth night of the ritual the sea went still. Then, far out past the breakwater, it began to boil. The priests on the shore kept chanting while green light rose from the depths, and the shapes that came out of the surf walked on two legs.\n\nThey are the Deep Ones, and they have come to serve. Somewhere in the South Pacific a sunken city has felt our call, and in his house at R'lyeh, dead Cthulhu dreams of [ROOT.GetNameDef]."
 eldritch.11.a:0 "Cthulhu fhtagn!"
 eldritch.12.t:0 "The Crawling Chaos Arrives"
 eldritch.12.d:0 "He arrived by train, in a well-cut suit, carrying a case of curious electrical instruments. He was tall, slender and dark, and he shook every minister's hand and called each of them by a childhood nickname.\n\nAt the end of the ritual he simply sat down in the cabinet room as if he had always been there. Nyarlathotep, the Crawling Chaos, has come to [ROOT.GetNameDef]. He has a thousand faces, and from now on he will wear some of ours."
 eldritch.12.a:0 "Welcome, messenger of the Outer Gods."
 eldritch.13.t:0 "Have You Seen the Yellow Sign?"
 eldritch.13.d:0 "The play reached its second act. In the hush that followed the final line, the Stranger in the Pallid Mask stepped onto the stage, and behind him, faint as a reflection, a city of twin suns and black stars hung over the audience.\n\nNobody left the theatre. When the doors opened at dawn, every member of the audience was wearing the Yellow Sign, and every one of them was smiling. Hastur, the King in Yellow, has claimed [ROOT.GetNameDef]."
 eldritch.13.a:0 "Hail the King in Yellow!"
 eldritch.14.t:0 "The Black Goat Comes"
 eldritch.14.d:0 "The fires on the hill burned for sixty nights. On the last night the forest at the edge of the clearing began to move. Something vast stepped out of the trees, an enormous tangle of ropy limbs on black hooves, and the faithful fell to their knees.\n\nThe Black Goat of the Woods with a Thousand Young has accepted [ROOT.GetNameDef]. Her children are already among us."
 eldritch.14.a:0 "Iä! Shub-Niggurath!"
 eldritch.15.t:0 "The Gate Opens"
 eldritch.15.d:0 "The geometry in the ritual chamber stopped making sense at 3:17 in the morning. Witnesses say the angles of the room turned outward. Through the gap they saw a conglomeration of iridescent globes, endlessly forming and dissolving, and in the globes they saw every moment that ever was or will be.\n\nThe scholars who survived are writing as fast as they can. Yog-Sothoth, the Gate and the Key, has opened itself to [ROOT.GetNameDef]."
 eldritch.15.a:0 "Yog-Sothoth is the gate."
 eldritch.16.t:0 "The Daemon Sultan Stirs"
 eldritch.16.d:0 "On the sixtieth night, the flutes began. Nobody brought them and nobody was playing them, but every person within ten miles heard the thin, monotonous whine. The ritual chamber, the temple and the hill it stood on are gone, replaced by a perfectly round crater still glowing faintly at the bottom.\n\nAt the centre of all infinity, the blind idiot god Azathoth has turned in our direction. Our soldiers have begun to march in time with music that is not there."
 eldritch.16.a:0 "Let the piping never cease."

 eldritch.20.t:0 "The Pact Deepens"
 eldritch.20.d.cthulhu:0 "Seismographs across the Pacific are recording tremors from a point where no fault line should be. Fishing fleets refuse to sail. Cthulhu is stirring, and his attention on [ROOT.GetNameDef] is no longer a dream."
 eldritch.20.d.nyarlathotep:0 "The Crawling Chaos now appears in three places at once: a cabinet meeting, a foreign embassy, and a radio studio broadcasting to the nation. Nyarlathotep is fully invested in [ROOT.GetNameDef]."
 eldritch.20.d.hastur:0 "Black stars are visible over the capital in broad daylight now. The Yellow Sign hangs in every barracks, and no soldier will look away from it. Hastur's gaze has settled on [ROOT.GetNameDef]."
 eldritch.20.d.shub_niggurath:0 "The forests around the capital have doubled in size over one summer. The Black Goat's young walk openly at dusk, and the farmers leave offerings at the treeline. Shub-Niggurath has made [ROOT.GetNameDef] her pasture."
 eldritch.20.d.yog_sothoth:0 "Our scientists are now publishing papers in journals that do not exist yet, citing experiments they have not yet run. The Gate is open wider, and Yog-Sothoth sees [ROOT.GetNameDef] across all of time."
 eldritch.20.d.azathoth:0 "The piping can be heard in every factory and every barracks. Workers do not sleep and soldiers do not rest. Azathoth's mindless attention has fully settled on [ROOT.GetNameDef]."
 eldritch.20.a:0 "Our god draws nearer."

 eldritch.30.t:0 "The Old One Ascendant"
 eldritch.30.d.cthulhu:0 "R'lyeh has risen. Its slimy green towers break the surface of the Pacific, and its great door stands open. Cthulhu walks again. His dreams have become waking orders, and [ROOT.GetNameDef] is his chosen nation on Earth."
 eldritch.30.d.nyarlathotep:0 "The Black Pharaoh's throne has been raised in the heart of our capital. Nyarlathotep no longer bothers with masks in our halls of power. He rules openly through [ROOT.GetNameDef], and the world's chancelleries are struck with paralysing doubt."
 eldritch.30.d.hastur:0 "Carcosa has come. Its towers rise behind the moon, the twin suns set over our capital, and the King in Yellow sits in a tattered mantle on our throne. [ROOT.GetNameDef] now belongs to Hastur."
 eldritch.30.d.shub_niggurath:0 "The Mother walks among us. Wherever she steps, life springs up, monstrous and endless. The Thousand Young number in the millions, and every one of them would die for [ROOT.GetNameDef]."
 eldritch.30.d.yog_sothoth:0 "The Gate stands fully open in our capital. Yog-Sothoth is all-in-one and one-in-all, and through [ROOT.GetNameDef] it reaches into every moment of history at once."
 eldritch.30.d.azathoth:0 "We have opened a door to the throne of chaos itself. Our weapons crackle with the energy of creation's birth, and the land shakes beneath our armies. Nobody in [ROOT.GetNameDef] sleeps, and nobody needs to."
 eldritch.30.a:0 "The stars are right!"

 eldritch.40.t:0 "[ROOT.GetEldritchGodName] Demands Tribute"
 eldritch.40.d:0 "The high priests have come to the capital, pale and shaking. Their god is hungry. The offerings have been too small, the rites too infrequent, the faithful too few. [ROOT.GetEldritchGodName] expects more from its chosen nation, and it is not known for patience."
 eldritch.40.a:0 "Give it blood."
 eldritch.40.b:0 "Our statesmen will make a show of devotion."
 eldritch.40.c:0 "We will not be its cattle!"
 eldritch.41.t:0 "A Prophet in the Streets"
 eldritch.41.d:0 "A ragged preacher is drawing huge crowds in the capital's squares. He claims [ROOT.GetEldritchGodName] speaks to him directly, and he describes our secret rites with frightening accuracy. The police ask whether he should be silenced."
 eldritch.41.a:0 "Silence the prophet. Discretion is everything."
 eldritch.41.b:0 "Let them preach. Let the people know their god."
 eldritch.42.t:0 "The Stars Are Right"
 eldritch.42.d:0 "Astronomers report an alignment of stars not seen in ten thousand years. In every temple of [ROOT.GetEldritchGodName] the candles burn black, and the faithful feel their god's attention like a weight on their shoulders."
 eldritch.42.a:0 "Iä! Iä!"
 eldritch.43.t:0 "Dreams of the Faithful"
 eldritch.43.d:0 "Last night thousands of our soldiers had the same dream: a battle in a strange land, fought and won under the eye of [ROOT.GetEldritchGodName]. They woke knowing tactics they were never taught."
 eldritch.43.a:0 "Our god teaches well."

 eldritch.60.t:0 "Nightmares of a Drowned City"
 eldritch.60.d:0 "All over [ROOT.GetNameDef], artists, poets and the sensitive-minded are dreaming the same dream: a city of green stone and impossible angles beneath the sea, and something vast stirring inside it. The asylums are overflowing. Some say the dreams started when [From.GetNameDef] began holding strange rites on its coasts."
 eldritch.60.a:0 "It is only a dream... isn't it?"
 eldritch.61.t:0 "The King in Yellow Performed"
 eldritch.61.d:0 "A touring theatre company has been performing a play called 'The King in Yellow' in our cities. Everyone who saw the second act is deeply changed. Soldiers have deserted to look for a city called Carcosa, and officers are writing letters to a king nobody has heard of. The company's papers were issued in [From.GetNameDef]."
 eldritch.61.a:0 "Burn every copy of that play!"
 eldritch.62.t:0 "The Smiling Stranger"
 eldritch.62.d:0 "For weeks a tall, dark lecturer has been touring [ROOT.GetNameDef], demonstrating strange electrical marvels to packed halls. The crowds leave entranced and restless, and political agitators have sprung up in his wake. Nobody can remember his name, but several witnesses insist his accent was from [From.GetNameDef]."
 eldritch.62.a:0 "Find this man!"

 eldritch_news.1.t:0 "Something Has Answered [From.GetNameDef]"
 eldritch_news.1.d.cthulhu:0 "Ships off the coast of [From.GetNameDef] report the sea boiling green, and coastal villages have been taken over by strange, fish-eyed people who walk out of the surf. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Cthulhu, the Dreamer in R'lyeh."
 eldritch_news.1.d.nyarlathotep:0 "A dark, smiling man now sits beside the leadership of [From.GetNameDef] at every public appearance. Foreign diplomats come out of meetings with him confused and frightened. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Nyarlathotep, the Crawling Chaos."
 eldritch_news.1.d.hastur:0 "A strange yellow symbol has appeared on the banners of [From.GetNameDef], and foreign journalists who look at it too long do not come home. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Hastur, the King in Yellow."
 eldritch_news.1.d.shub_niggurath:0 "Travellers in [From.GetNameDef] describe forests that move at night and enormous, many-limbed shapes among the trees. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Shub-Niggurath, the Black Goat of the Woods."
 eldritch_news.1.d.yog_sothoth:0 "Observatories around the world recorded a tear in the sky above [From.GetNameDef], full of shimmering spheres, which lasted for exactly one hour. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Yog-Sothoth, the Gate and the Key."
 eldritch_news.1.d.azathoth:0 "A crater has appeared in [From.GetNameDef] where a hill used to be, and radio operators around the world are picking up a thin, piping whine on every frequency. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Azathoth, the Daemon Sultan."
 eldritch_news.1.a:0 "May it never turn its gaze toward us."
 eldritch_news.2.t:0 "An Old One Walks the Earth"
 eldritch_news.2.d:0 "Whatever [From.GetNameDef] has been doing in its temples, it is finished. [From.GetEldritchGodName] has fully crossed into our world and stands at the side of [From.GetNameDef]. Governments everywhere are holding emergency sessions, and churches are full."
 eldritch_news.2.a:0 "The stars are right, and we are not ready."

