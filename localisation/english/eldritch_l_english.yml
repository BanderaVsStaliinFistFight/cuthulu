 ################################################################
 # DECISIONS - THE FORBIDDEN LORE & SUMMONINGS
 ################################################################

 eldritch_seek_forbidden_lore:0 "Seek the Forbidden Lore"
 eldritch_seek_forbidden_lore_desc:0 "People talk of a book bound in something that is not leather, the verses of a mad poet copied by monks who later put out their own eyes. Our agents could find a copy: in the restricted stacks of Miskatonic University, in a bazaar in Sana'a, in a crypt under Prague. Once we read it, there is no going back.\n\n§YFinding it reveals the summoning rituals of six Old Ones. Only ONE of them can ever be bound to [ROOT.GetNameDef].§!"

 eldritch_summon_cthulhu:0 "Summon Cthulhu, the Dreamer in R'lyeh"
 eldritch_summon_cthulhu_desc:0 "§HPh'nglui mglw'nafh Cthulhu R'lyeh wgah'nagl fhtagn.§!\nIn his house at R'lyeh, dead Cthulhu waits dreaming. At the darkest tide our priests will go down to the sea and sing the words until the drowned city answers.\n\nCthulhu favours §Ynavies and invasions from the sea§!, and sends the amphibious §YDeep Ones§! and the colossal §YStar-Spawn§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_nyarlathotep:0 "Summon Nyarlathotep, the Crawling Chaos"
 eldritch_summon_nyarlathotep_desc:0 "He is the soul and messenger of the Outer Gods, and he wears a thousand masks: the Black Pharaoh, the Haunter of the Dark, the smiling stranger in a fine suit. He has always been eager to bargain.\n\nNyarlathotep favours §Ypolitics, intrigue and subversion§!, and lends §YFaceless Cultists§! and swift §YShantak Riders§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_hastur:0 "Summon Hastur, the King in Yellow"
 eldritch_summon_hastur_desc:0 "§HAlong the shore the cloud waves break, the twin suns sink behind the lake.§!\nWe will stage the forbidden play in full, all the way to the second act. When the Stranger takes off his mask, the King in Yellow will have come to [ROOT.GetNameDef].\n\nHastur favours §Ymorale and the air§!, and lends fanatical §YZealots of the Yellow Sign§! and winged §YByakhee Riders§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_shub_niggurath:0 "Summon Shub-Niggurath, the Black Goat"
 eldritch_summon_shub_niggurath_desc:0 "§HIä! Shub-Niggurath! The Black Goat of the Woods with a Thousand Young!§!\nOn the hills where the old stones stand, the faithful will light the fires and give her what she asks for. In return, she gives life: endless, overflowing and monstrous.\n\nShub-Niggurath favours §Ypopulation, manpower and endurance§!, and sends the towering §YDark Young§! and the swarming §YThousand Young§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_yog_sothoth:0 "Summon Yog-Sothoth, the Gate and the Key"
 eldritch_summon_yog_sothoth_desc:0 "§HYog-Sothoth knows the gate. Yog-Sothoth is the gate. Yog-Sothoth is the key and guardian of the gate.§!\nPast, present and future are all one in Yog-Sothoth. Our scholars will open the Gate and look through, if their minds can bear it.\n\nYog-Sothoth favours §Yresearch and planning§!, and lends the stalwart §YWardens of the Gate§! and the unseen §YDunwich Horror§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_azathoth:0 "Summon Azathoth, the Daemon Sultan"
 eldritch_summon_azathoth_desc:0 "At the centre of all infinity, the blind idiot god Azathoth gnaws hungrily in unlit chambers beyond time, lulled by the thin, monotonous whine of accursed flutes. Calling him is madness. Calling him works.\n\nAzathoth offers §Ypure destruction§!: unmatched §Yattack and breakthrough§!, the §YSpawn of the Nuclear Chaos§! and the §YVoid Pipers§!. The price is our nation's §Rstability§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"

 ################################################################
 # DECISIONS - COMMON RITES
 ################################################################

 eldritch_rite_of_worship:0 "Hold a Rite of Worship"
 eldritch_rite_of_worship_desc:0 "Black tallow candles, an altar of unknown stone, and chanting in a language no human throat was made for. The rite is unpleasant, but [ROOT.GetEldritchGodName] is listening."
 eldritch_blood_sacrifice:0 "Offer a Blood Sacrifice"
 eldritch_blood_sacrifice_desc:0 "Prayer alone does not sustain [ROOT.GetEldritchGodName]. The conscription offices will send some of their intake to the temple instead of the barracks. Nobody will ask questions. Nobody who asks will be heard from again."
 eldritch_deepen_pact_2:0 "Deepen the Pact: Rouse [ROOT.GetEldritchGodName]"
 eldritch_deepen_pact_2_desc:0 "So far [ROOT.GetEldritchGodName] has given us only a fraction of its attention. A grander rite, held over many nights, will draw its gaze fully onto [ROOT.GetNameDef].\n\n§YRaises the pact to Tier II: a stronger national spirit, stronger eldritch battalions, more Favor each month, and access to the god's Avatar.§!"
 eldritch_deepen_pact_3:0 "Deepen the Pact: [ROOT.GetEldritchGodName] Ascendant"
 eldritch_deepen_pact_3_desc:0 "The final rite. When it is done, [ROOT.GetEldritchGodName] will not merely favour [ROOT.GetNameDef]; it will walk beside us. The world will notice.\n\n§YRaises the pact to Tier III: the ultimate national spirit, the strongest eldritch battalions, the most Favor each month, and a unique gift from the god.§!"
 eldritch_anoint_general:0 "Anoint a Champion of [ROOT.GetEldritchGodName]"
 eldritch_anoint_general_desc:0 "One of our commanders will be taken to the inner sanctum and shown what lies behind the veil. Most survive, and those who do lead with terrible certainty.\n\n§YAn un-anointed general gains the patron's blessing trait. Field marshals are chosen first.§!"
 eldritch_anoint_admiral:0 "Anoint an Admiral of [ROOT.GetEldritchGodName]"
 eldritch_anoint_admiral_desc:0 "The sea is older than the land, and it remembers the Old Ones. One of our admirals will be blessed so that the deep waters fight for us.\n\n§YAn un-anointed admiral gains the patron's blessing trait.§!"
 eldritch_exalt_prophet:0 "Exalt the Prophet"
 eldritch_exalt_prophet_desc:0 "[ROOT.GetLeader] has led us into this pact. Now [ROOT.GetEldritchGodName] will mark our leader as its chosen voice on Earth.\n\n§YThe current leader gains the patron's Herald and Chosen traits. If a new leader takes power, they can be exalted as well once this rite is available again.§!"
 eldritch_call_servitors:0 "Call Forth the Servitors"
 eldritch_call_servitors_desc:0 "The servants of [ROOT.GetEldritchGodName] are numberless, and the god will lend them to its faithful for a price.\n\n§YTwo veteran divisions of the god's locked template appear near our capital.§!"
 eldritch_incarnate_god:0 "Incarnate [ROOT.GetEldritchGodName] in the Flesh"
 eldritch_incarnate_god_desc:0 "The servants are not enough. Over thirty nights, the full congregation of [ROOT.GetNameDef] will chant [ROOT.GetEldritchGodName] into a body that can walk the earth and fight beside our armies.\n\n§YSpawns the god itself as one veteran division: a colossal god battalion with a thousand strength, enormous organization, attack, defense, breakthrough and piercing, and its own recon and initiative, escorted by its servitors. Two more servitor divisions come with it. While it lives, our armies fight harder and every nation at war with us is gripped by dread. The god cannot be trained or added to other templates. Only one incarnation can walk the earth at a time: once it is destroyed, it can be incarnated again, at most once a year.§!\n§HZeal§! check: a pleased god returns some of the offering."

 ################################################################
 # DECISIONS - CTHULHU
 ################################################################

 eldritch_cthulhu_tide_blessing:0 "Beseech the Tide of R'lyeh"
 eldritch_cthulhu_tide_blessing_desc:0 "Ask the Dreamer to send his dreams into the sea. For a season the waves will favour our ships and our landings, and the enemy's sailors will wake screaming."
 eldritch_cthulhu_avatar:0 "Raise Father Dagon and Mother Hydra"
 eldritch_cthulhu_avatar_desc:0 "Two ancient Deep Ones, vast with age, rule the hybrid cities under the waves. They will rise to command our fleets and armies.\n\n§YCreates a unique admiral and a unique field marshal.§!"
 eldritch_cthulhu_send_nightmares:0 "Send Nightmares to [From.GetNameDef]"
 eldritch_cthulhu_send_nightmares_desc:0 "Artists, poets and sensitive souls across [From.GetNameDef] will dream of a green, slimy city of impossible angles. Some of them will not stop screaming.\n\n§YPlaces the 'Dreams of R'lyeh' curse on the enemy for 90 days.§!\n§HLore§! check: the curse lasts 90 days in full, or 45 on a failure."

 ################################################################
 # DECISIONS - NYARLATHOTEP
 ################################################################

 eldritch_nyarlathotep_masks_blessing:0 "Don the Thousand Masks"
 eldritch_nyarlathotep_masks_blessing_desc:0 "Nyarlathotep walks among our ministers wearing their own faces. Opposition crumbles and rivals become allies, and nobody can say exactly why."
 eldritch_nyarlathotep_avatar:0 "Summon the Black Pharaoh"
 eldritch_nyarlathotep_avatar_desc:0 "Nephren-Ka was the pharaoh whose name was struck from every monument. He has waited a long time to wage war again.\n\n§YCreates a unique field marshal.§!"
 eldritch_nyarlathotep_whispers:0 "Whisper Madness into [From.GetNameDef]"
 eldritch_nyarlathotep_whispers_desc:0 "A charismatic stranger is touring [From.GetNameDef], giving lectures on electricity and the stars. Crowds follow him. Afterwards they cannot remember what he said, but they believe it completely.\n\n§YDestabilizes the target and spreads our ideology there.§!\n§HLore§! check: on a failure the whispers only shake the target's stability."

 ################################################################
 # DECISIONS - HASTUR
 ################################################################

 eldritch_hastur_sign_blessing:0 "Unveil the Yellow Sign"
 eldritch_hastur_sign_blessing_desc:0 "The Yellow Sign will be painted on every banner and every wing. Those who see it will follow it without fear or hesitation."
 eldritch_hastur_avatar:0 "Invite the Stranger in the Pallid Mask"
 eldritch_hastur_avatar_desc:0 "'You, sir, should unmask.' 'Indeed?' 'Indeed it's time. We all have laid aside disguise but you.' 'I wear no mask.'\n\n§YCreates a unique field marshal.§!"
 eldritch_hastur_stage_play:0 "Stage 'The King in Yellow' in [From.GetNameDef]"
 eldritch_hastur_stage_play_desc:0 "A touring company will perform the forbidden play in the theatres of [From.GetNameDef]. The first act is harmless. Nobody who sees the second act is ever the same.\n\n§YPlaces 'The Yellow Madness' curse on the enemy for 90 days.§!\n§HLore§! check: the curse lasts 90 days in full, or 45 on a failure."

 ################################################################
 # DECISIONS - SHUB-NIGGURATH
 ################################################################

 eldritch_shub_niggurath_feast_blessing:0 "Feast of the Black Goat"
 eldritch_shub_niggurath_feast_blessing_desc:0 "A great feast on the hills under the full moon. For months afterwards the wombs of [ROOT.GetNameDef] will be fruitful, and wounded soldiers will heal faster than they should."
 eldritch_shub_niggurath_avatar:0 "Call the Shepherd of the Black Goat"
 eldritch_shub_niggurath_avatar_desc:0 "Something stands at the edge of the woods, wearing horns and a shepherd's cloak, and the Dark Young bow to it.\n\n§YCreates a unique field marshal.§!"
 eldritch_shub_niggurath_thousand_young:0 "Rite of the Thousand Young"
 eldritch_shub_niggurath_thousand_young_desc:0 "Ask the Mother for her children. They come out of the forest by the hundreds, looking almost human, and they are eager to serve.\n\n§YGrants a large pool of manpower.§!"

 ################################################################
 # DECISIONS - YOG-SOTHOTH
 ################################################################

 eldritch_yog_sothoth_gate_blessing:0 "Gaze Through the Gate"
 eldritch_yog_sothoth_gate_blessing_desc:0 "Our scholars will be allowed to look through the Gate, where all time and space are one. They will come back with answers to questions nobody has asked yet."
 eldritch_yog_sothoth_avatar:0 "Bring Forth Wilbur Whateley"
 eldritch_yog_sothoth_avatar_desc:0 "Son of Lavinia Whateley and a father nobody names, Wilbur grew to adulthood in ten years and reads Latin as easily as English. His twin is better left unmentioned.\n\n§YCreates a unique field marshal.§!"
 eldritch_yog_sothoth_open_gate:0 "Open the Gate"
 eldritch_yog_sothoth_open_gate_desc:0 "Plans for machines that will not be invented for decades, written in our engineers' own handwriting, appear in our laboratories overnight.\n\n§YGrants research bonuses for industry and electronics.§!"

 ################################################################
 # DECISIONS - AZATHOTH
 ################################################################

 eldritch_azathoth_fury_blessing:0 "Dance to the Daemon Flutes"
 eldritch_azathoth_fury_blessing_desc:0 "Play the thin, monotonous piping of the Outer Void over every radio set in the army. The men will fight like the ones who dance around the Daemon Sultan's throne: without thought, without fear, without mercy."
 eldritch_azathoth_avatar:0 "Summon the Piper of the Void"
 eldritch_azathoth_avatar_desc:0 "One of the mindless flute-players from the court of Azathoth has stepped into our world. It does not speak. It plays, and armies march to its tune.\n\n§YCreates a unique field marshal.§!"
 eldritch_azathoth_nuclear_chaos:0 "Bottle the Nuclear Chaos"
 eldritch_azathoth_nuclear_chaos_desc:0 "Azathoth is the nuclear chaos at the heart of all things. A tiny fragment of it, sealed in lead, will destroy any city on Earth.\n\n§YGrants a nuclear bomb.§!"

 ################################################################
 # DECISIONS - THE PROPHET
 ################################################################

 eldritch_prophet_record:0 "The Prophet's Record"
 eldritch_prophet_record_desc:0 "Every rite leaves its mark on the one who leads it. The cult keeps a record of what the Prophet has learned, endured and become.\n\n§YOpens the Prophet's character sheet: level, experience and the three stats, Lore, Zeal and Will. Spend Insight there.§!"
 eldritch_prophet_commune:0 "Commune with [ROOT.GetEldritchGodName]"
 eldritch_prophet_commune_desc:0 "[ROOT.GetLeader] will go down alone into the sanctum beneath the capital, and for ten days nobody will see or hear from them. Those who have done this before describe it as drowning in a voice.\n\n§YAfter 10 days the Prophet asks for strength (army and navy experience), knowledge (research bonuses) or simply listens (Favor). A §HWill§! check decides whether the Prophet comes back changed.§!"
 eldritch_prophet_preach:0 "Preach to the Faithful"
 eldritch_prophet_preach_desc:0 "The pact has frightened the people. [ROOT.GetLeader] will stand on the palace balcony and tell them what [ROOT.GetEldritchGodName] has promised, and the crowd will go home calmer, and a little stranger.\n\n§YStability and war support. The god's Chosen preaches better.§!\n§HZeal§! check: a roused crowd brings more war support."
 eldritch_prophet_tithe:0 "Demand a Tithe from the Cult"
 eldritch_prophet_tithe_desc:0 "The cult has grown rich on offerings. [ROOT.GetLeader] will remind its priests who leads this nation, and the money will find its way into the treasury.\n\n§YTurns Favor into political power.§!"
 eldritch_prophet_dark_council:0 "Convene the Dark Council"
 eldritch_prophet_dark_council_desc:0 "[ROOT.GetLeader] will sit at the head of a long table in a windowless room. Around it will sit the generals and admirals [ROOT.GetEldritchGodName] has touched and, if one has come, an avatar of the god itself. What they plan there will not be written down.\n\n§YNeeds an anointed general or admiral, or an avatar. 120 days of faster, deeper planning and better organization, plus command power (more if an avatar attends).§!"
 eldritch_prophet_review_servitors:0 "Review the Servitor Legions"
 eldritch_prophet_review_servitors_desc:0 "[ROOT.GetLeader] will ride out to the front and inspect the servants of [ROOT.GetEldritchGodName] in person. The newspapers will print the photographs, though the editors will crop them carefully.\n\n§YNeeds eldritch battalions in the field. Army experience, war support and a little Favor.§!"
 eldritch_prophet_march_with_god:0 "March Beside [ROOT.GetEldritchGodName]"
 eldritch_prophet_march_with_god_desc:0 "The god walks among our soldiers. [ROOT.GetLeader] will walk with it, at the head of the army, where every soldier can see that their leader is not afraid.\n\n§YNeeds the incarnate god on the map. 90 days of better attack and morale.§!"
 eldritch_prophet_name_the_cursed:0 "Speak the Name of [From.GetNameDef]"
 eldritch_prophet_name_the_cursed_desc:0 "The curse we laid on [From.GetNameDef] is fading. In the next rite, [ROOT.GetLeader] will speak the enemy's name aloud, and the madness will come back.\n\n§YThe enemy's curse lasts 60 days longer, and it loses war support.§!"
 eldritch_prophet_great_temple:0 "Raise the Great Temple"
 eldritch_prophet_great_temple_desc:0 "[ROOT.GetLeader] will lay the first stone of a temple to [ROOT.GetEldritchGodName] in the heart of the capital. Its architects have stopped sleeping, and its angles do not quite meet.\n\n§YA 90-day construction. The Great Temple adds stability and political power, and §G3§! Eldritch Favor every month for the rest of the game. Once per game.§!"
 eldritch_prophet_become_vessel:0 "Become the Vessel"
 eldritch_prophet_become_vessel_desc:0 "[ROOT.GetEldritchGodName] has asked for the last thing [ROOT.GetLeader] has left to give. For sixty days the Prophet will lie in the sanctum while the god pours itself in. What comes out will still lead the nation. It will not be entirely human.\n\n§YNeeds an Ascendant pact and a Chosen leader. The leader gains the god's powerful §YVessel§! trait; the nation loses stability and gains war support, and the whole world will hear of it. Once per game; the trait is lost if the leader is replaced.§!\n§HWill§! check: a Prophet who keeps hold of their mind halves the stability loss."

 eldritch_perk_lore_1:0 "Lore: The Pnakotic Fragments"
 eldritch_perk_lore_1_desc:0 "The oldest pages in the cult's library were written before there were humans to read them. The Prophet has learned to read them anyway."
 eldritch_perk_lore_2:0 "Lore: Curses That Linger"
 eldritch_perk_lore_2_desc:0 "A curse is a word that keeps being spoken. The Prophet has learned how to make it echo."
 eldritch_perk_lore_3:0 "Lore: Forbidden Science"
 eldritch_perk_lore_3_desc:0 "The Prophet takes the nation's scientists into the sanctum, one at a time. They come out knowing things."
 eldritch_perk_zeal_1:0 "Zeal: The Fervent Host"
 eldritch_perk_zeal_1_desc:0 "The servitors have seen the Prophet bleed for the god, and now they will bleed for the Prophet."
 eldritch_perk_zeal_2:0 "Zeal: The Prophet's Banner"
 eldritch_perk_zeal_2_desc:0 "Wherever the Prophet's banner goes, the faithful follow, and they follow faster."
 eldritch_perk_zeal_3:0 "Zeal: Voice of the God"
 eldritch_perk_zeal_3_desc:0 "When the Prophet speaks, the god listens. On the battlefield, it fights for that voice."
 eldritch_perk_will_1:0 "Will: Iron Composure"
 eldritch_perk_will_1_desc:0 "The Prophet has stared into the abyss long enough to stop flinching."
 eldritch_perk_will_2:0 "Will: The Elder Sign"
 eldritch_perk_will_2_desc:0 "The Prophet carves the five-pointed sign over every door of the capital. The servants of other gods cannot pass it."
 eldritch_perk_will_3:0 "Will: Apostolic Succession"
 eldritch_perk_will_3_desc:0 "The god no longer waits to be asked. Whoever leads [ROOT.GetNameDef] next will wake up already marked."

 ################################################################
 # NATIONAL SPIRITS
 ################################################################

 eldritch_cthulhu_pact_1:0 "Pact of the Sleeping God"
 eldritch_cthulhu_pact_1_desc:0 "Cthulhu dreams, and his dreams have turned toward us. Our shipwrights work faster, our sailors fight harder, and the coastal towns have strange new neighbours."
 eldritch_cthulhu_pact_2:0 "Stirrings in R'lyeh"
 eldritch_cthulhu_pact_2_desc:0 "Earthquakes in the South Pacific. Fishermen pull up carvings that no human hand made. The Dreamer is turning in his sleep."
 eldritch_cthulhu_pact_3:0 "Cthulhu Fhtagn"
 eldritch_cthulhu_pact_3_desc:0 "R'lyeh has risen. Its non-Euclidean towers glisten above the waves, and every Deep One in every ocean answers our call."
 eldritch_cthulhu_blessing:0 "Tide of R'lyeh"
 eldritch_cthulhu_blessing_desc:0 "The sea itself has taken our side."
 eldritch_curse_dreams_of_rlyeh:0 "Dreams of R'lyeh"
 eldritch_curse_dreams_of_rlyeh_desc:0 "Across the nation, sensitive minds are plagued by visions of a drowned city. Asylums are full, and the government cannot think straight."

 eldritch_nyarlathotep_pact_1:0 "Pact of the Crawling Chaos"
 eldritch_nyarlathotep_pact_1_desc:0 "A dark, thin man has joined the cabinet. Nobody remembers appointing him, and nobody dares to dismiss him."
 eldritch_nyarlathotep_pact_2:0 "The Thousand Masks"
 eldritch_nyarlathotep_pact_2_desc:0 "Nyarlathotep speaks through our diplomats, our newspapers and our radio sets. Truth has become whatever he says it is."
 eldritch_nyarlathotep_pact_3:0 "The Black Pharaoh Reigns"
 eldritch_nyarlathotep_pact_3_desc:0 "Nephren-Ka's throne has been rebuilt in the capital. Our nation moves as one under the Crawling Chaos, and our enemies argue among themselves."
 eldritch_nyarlathotep_blessing:0 "Masks of Nyarlathotep"
 eldritch_nyarlathotep_blessing_desc:0 "Every face in parliament is smiling the same smile."

 eldritch_hastur_pact_1:0 "Pact of the King in Yellow"
 eldritch_hastur_pact_1_desc:0 "Copies of an unpublished play circulate among our officers. The Yellow Sign is chalked on barrack walls."
 eldritch_hastur_pact_2:0 "The Yellow Sign Spreads"
 eldritch_hastur_pact_2_desc:0 "Black stars burn in the evening sky over our airfields. Our pilots claim the Byakhee fly beside them."
 eldritch_hastur_pact_3:0 "Carcosa Ascendant"
 eldritch_hastur_pact_3_desc:0 "Lost Carcosa lies over our capital like a veil. Strange is the night where black stars rise, and stranger still are the soldiers who march beneath them."
 eldritch_hastur_blessing:0 "The Yellow Sign Unveiled"
 eldritch_hastur_blessing_desc:0 "Every soldier who has seen the Sign would sooner die than retreat."
 eldritch_curse_yellow_madness:0 "The Yellow Madness"
 eldritch_curse_yellow_madness_desc:0 "Soldiers who saw the forbidden play desert their posts to look for Carcosa. Officers write letters to a king who does not exist."

 eldritch_shub_niggurath_pact_1:0 "Pact of the Black Goat"
 eldritch_shub_niggurath_pact_1_desc:0 "The harvests are heavy, the cradles are full, and something in the woods bleats at night."
 eldritch_shub_niggurath_pact_2:0 "The Woods Are Fruitful"
 eldritch_shub_niggurath_pact_2_desc:0 "Children grow up unusually fast and unusually strong. The midwives have stopped counting the extra fingers."
 eldritch_shub_niggurath_pact_3:0 "The Thousand Young"
 eldritch_shub_niggurath_pact_3_desc:0 "The Black Goat's children are everywhere. Our ranks refill faster than any enemy can empty them."
 eldritch_shub_niggurath_blessing:0 "Fecundity of the Black Goat"
 eldritch_shub_niggurath_blessing_desc:0 "Life overflows, monstrous and abundant."

 eldritch_yog_sothoth_pact_1:0 "Pact of the Gate"
 eldritch_yog_sothoth_pact_1_desc:0 "Our scientists have started dreaming in equations. Some of the equations describe colours that do not exist."
 eldritch_yog_sothoth_pact_2:0 "Glimpses Beyond the Gate"
 eldritch_yog_sothoth_pact_2_desc:0 "Our general staff read reports of battles that have not happened yet. The reports are always correct."
 eldritch_yog_sothoth_pact_3:0 "The Gate and the Key"
 eldritch_yog_sothoth_pact_3_desc:0 "Yog-Sothoth is the gate, and the gate stands open in our capital. All knowledge, past and future, lies within reach."
 eldritch_yog_sothoth_blessing:0 "All Is One in Yog-Sothoth"
 eldritch_yog_sothoth_blessing_desc:0 "Past, present and future merge, and our planners can see all three at once."

 eldritch_azathoth_pact_1:0 "Pact of the Daemon Sultan"
 eldritch_azathoth_pact_1_desc:0 "Somewhere at the centre of the universe, the blind god has turned its idiot attention toward us. Our soldiers fight with a terrible, joyless fury."
 eldritch_azathoth_pact_2:0 "The Piping Grows Louder"
 eldritch_azathoth_pact_2_desc:0 "Factory workers hear thin flute music over the machines. They work until they collapse, and production soars."
 eldritch_azathoth_pact_3:0 "The Nuclear Chaos Unbound"
 eldritch_azathoth_pact_3_desc:0 "We have opened a door onto the boiling heart of creation. Nothing can stand against us, and nothing in our own nation is stable any more."
 eldritch_azathoth_blessing:0 "Mindless Fury"
 eldritch_azathoth_blessing_desc:0 "The army fights like the dancers around the throne of chaos."

 eldritch_prophets_fever:0 "The Prophet's Fever"
 eldritch_prophets_fever_desc:0 "Our leader has not slept since the trance. The speeches are longer now, and some of them are not in any human language. The crowds love it."
 eldritch_dark_council:0 "The Dark Council"
 eldritch_dark_council_desc:0 "The anointed commanders meet in a room without windows. The plans they bring out are uncannily good."
 eldritch_prophet_marches:0 "The Prophet Marches with the God"
 eldritch_prophet_marches_desc:0 "Our leader walks at the head of the army beside the god itself. No soldier will retreat while they can see that."
 eldritch_great_temple:0 "The Great Temple"
 eldritch_great_temple_desc:0 "A temple to our patron towers over the capital. The faithful come by the thousand, and something answers from inside it."
 eldritch_god_walks:0 "A God Walks Among Us"
 eldritch_god_walks_desc:0 "Our soldiers have seen what marches with them. No army of men can frighten them now.\n\n§YLasts while the incarnate god's division is on the map (checked every month).§!"
 eldritch_dread_of_the_god:0 "Dread of the Incarnate"
 eldritch_dread_of_the_god_desc:0 "Somewhere on the front, something that should not exist is walking towards our lines. The men can feel it before they see it, and many do not wait to see it."
 eldritch_prophet_mantle:0 "The Prophet's Mantle"
 eldritch_prophet_mantle_desc:0 "The cult's chosen voice carries everything the rites have taught it."
 eldritch_prophet_mantle_tt:0 "Grows with the Prophet's §YLore§!, §YZeal§! and §YWill§! (2% per point). Lapses while the leader does not bear the god's mark."

 ################################################################
 # COUNTRY LEADER TRAITS
 ################################################################

 eldritch_cthulhu_herald:0 "Dreamer of R'lyeh"
 eldritch_cthulhu_herald_desc:0 "Shares the dreams of the Sleeper."
 eldritch_cthulhu_chosen:0 "Voice of the Sleeper"
 eldritch_cthulhu_chosen_desc:0 "Speaks with the voice of Cthulhu himself."
 eldritch_nyarlathotep_herald:0 "Mask of the Crawling Chaos"
 eldritch_nyarlathotep_herald_desc:0 "Is this still our leader, or one of Nyarlathotep's masks?"
 eldritch_nyarlathotep_chosen:0 "Vizier of the Black Pharaoh"
 eldritch_nyarlathotep_chosen_desc:0 "First servant of Nephren-Ka."
 eldritch_hastur_herald:0 "Bearer of the Yellow Sign"
 eldritch_hastur_herald_desc:0 "Has seen the Sign and understood it."
 eldritch_hastur_chosen:0 "Prince of Carcosa"
 eldritch_hastur_chosen_desc:0 "Heir to the tattered throne of the King in Yellow."
 eldritch_shub_niggurath_herald:0 "Shepherd of the Black Goat"
 eldritch_shub_niggurath_herald_desc:0 "Tends the Mother's flock."
 eldritch_shub_niggurath_chosen:0 "Keeper of the Thousand Young"
 eldritch_shub_niggurath_chosen_desc:0 "The Black Goat's children call this leader kin."
 eldritch_yog_sothoth_herald:0 "Keeper of the Gate"
 eldritch_yog_sothoth_herald_desc:0 "Holds the knowledge of the threshold."
 eldritch_yog_sothoth_chosen:0 "The Key and the Guardian"
 eldritch_yog_sothoth_chosen_desc:0 "Sees all times at once."
 eldritch_azathoth_herald:0 "Herald of the Daemon Sultan"
 eldritch_azathoth_herald_desc:0 "Announces the coming of chaos."
 eldritch_azathoth_chosen:0 "Piper at the Throne of Chaos"
 eldritch_azathoth_chosen_desc:0 "Plays the flute that lulls the idiot god."

 eldritch_cthulhu_vessel:0 "Flesh of the Sleeper"
 eldritch_cthulhu_vessel_desc:0 "Gills have opened along the Prophet's throat. They dream Cthulhu's dreams while awake."
 eldritch_nyarlathotep_vessel:0 "Mask of the Crawling Chaos"
 eldritch_nyarlathotep_vessel_desc:0 "The face is the Prophet's. The thing smiling behind it is not."
 eldritch_hastur_vessel:0 "The Pallid Mask"
 eldritch_hastur_vessel_desc:0 "The Prophet no longer takes off the mask. Perhaps they no longer can."
 eldritch_shub_niggurath_vessel:0 "Womb of the Thousand Young"
 eldritch_shub_niggurath_vessel_desc:0 "The Prophet's shadow has hooves and too many limbs. The fields bloom wherever it falls."
 eldritch_yog_sothoth_vessel:0 "The Key Made Flesh"
 eldritch_yog_sothoth_vessel_desc:0 "The Prophet answers questions before they are asked, and sometimes before they are thought."
 eldritch_azathoth_vessel:0 "Seat of the Daemon Sultan"
 eldritch_azathoth_vessel_desc:0 "A thin piping follows the Prophet everywhere. Nobody near them can think clearly, and nobody needs to."

 ################################################################
 # GENERAL & ADMIRAL TRAITS
 ################################################################

 eldritch_cthulhu_general:0 "Deep-Touched"
 eldritch_cthulhu_general_desc:0 "Has walked the streets of drowned R'lyeh and returned. Excels at landings from the sea."
 eldritch_cthulhu_admiral:0 "Admiral of the Drowned Fleet"
 eldritch_cthulhu_admiral_desc:0 "The Deep Ones guide this admiral's torpedoes."
 eldritch_nyarlathotep_general:0 "Many-Masked"
 eldritch_nyarlathotep_general_desc:0 "Nobody, including the enemy, knows what this general will do next."
 eldritch_nyarlathotep_admiral:0 "Haunter of the Dark Waters"
 eldritch_nyarlathotep_admiral_desc:0 "Moves the fleet like a shadow."
 eldritch_hastur_general:0 "Gazer upon the Yellow Sign"
 eldritch_hastur_general_desc:0 "Troops under this general fear their commander more than the enemy."
 eldritch_hastur_admiral:0 "Sailor of the Lake of Hali"
 eldritch_hastur_admiral_desc:0 "Has sailed the cloud-waves of Hali, beneath the twin suns."
 eldritch_shub_niggurath_general:0 "Blessed of the Black Goat"
 eldritch_shub_niggurath_general_desc:0 "This general's troops seem to feed themselves."
 eldritch_shub_niggurath_admiral:0 "Mother's Mariner"
 eldritch_shub_niggurath_admiral_desc:0 "The hulls of this admiral's ships are said to heal themselves."
 eldritch_yog_sothoth_general:0 "Seer Beyond the Gate"
 eldritch_yog_sothoth_general_desc:0 "Plans for battles before the enemy has decided to fight them."
 eldritch_yog_sothoth_admiral:0 "Navigator of the Spheres"
 eldritch_yog_sothoth_admiral_desc:0 "Sails routes that do not appear on any map."
 eldritch_azathoth_general:0 "Mad with Chaos"
 eldritch_azathoth_general_desc:0 "Attacks always and everywhere, with no thought for defense."
 eldritch_azathoth_admiral:0 "Captain of the Void"
 eldritch_azathoth_admiral_desc:0 "Fights with a reckless frenzy that terrifies friend and foe alike."
 eldritch_avatar_land:0 "Avatar of the Old Ones"
 eldritch_avatar_land_desc:0 "Not human, and never was."
 eldritch_avatar_navy:0 "Avatar of the Deep"
 eldritch_avatar_navy_desc:0 "Not human, and never was."

 ################################################################
 # BATTALIONS
 ################################################################

 eldritch_deep_one_brood:0 "Deep One Brood"
 eldritch_deep_one_brood_desc:0 "Fish-eyed, gilled, and immortal unless killed, the Deep Ones are born for assaults from the sea and across rivers."
 eldritch_star_spawn:0 "Star-Spawn of Cthulhu"
 eldritch_star_spawn_desc:0 "Towering kin of the Dreamer that arrived from the stars long before mankind. Few in number, vast in strength."
 eldritch_faceless_cult:0 "Faceless Cultists"
 eldritch_faceless_cult_desc:0 "Nyarlathotep's devotees wear blank masks and fight with uncanny discipline, especially in city streets."
 eldritch_shantak_riders:0 "Shantak Riders"
 eldritch_shantak_riders_desc:0 "Riders mounted on the horse-headed, scaly birds of Leng. Fast and terrifying."
 eldritch_yellow_zealots:0 "Zealots of the Yellow Sign"
 eldritch_yellow_zealots_desc:0 "Fanatics who have read the play to its end. They know no fear and do not break."
 eldritch_byakhee_riders:0 "Byakhee Riders"
 eldritch_byakhee_riders_desc:0 "Shock troops carried into battle on the leathery wings of Hastur's servitors. Can be dropped behind enemy lines like paratroopers."
 eldritch_dark_young:0 "Dark Young"
 eldritch_dark_young_desc:0 "Tree-like masses of ropy black tentacles on hoofed legs. Nearly unstoppable in forests and jungles."
 eldritch_thousand_young:0 "Thousand Young"
 eldritch_thousand_young_desc:0 "The Black Goat's countless half-human children. Poorly organized, cheap and quick to raise, and always more of them."
 eldritch_gate_wardens:0 "Wardens of the Gate"
 eldritch_gate_wardens_desc:0 "Soldiers who have glimpsed the future and know exactly where the enemy will strike. Superb defenders."
 eldritch_dunwich_horror:0 "Dunwich Horror"
 eldritch_dunwich_horror_desc:0 "An invisible, house-sized spawn of Yog-Sothoth. The only sign of it is the crushed earth where it steps."
 eldritch_chaos_spawn:0 "Spawn of the Nuclear Chaos"
 eldritch_chaos_spawn_desc:0 "Warped fragments of the primordial chaos, shaped roughly into soldiers. They hit hard and do not care about anything else."
 eldritch_void_pipers:0 "Void Pipers"
 eldritch_void_pipers_desc:0 "Amorphous flute-players whose maddening piping tears at enemy lines from afar."

 eldritch_cthulhu_incarnate:0 "Great Cthulhu"
 eldritch_cthulhu_incarnate_desc:0 "A mountain of green, rubbery flesh with an octopus head, a mass of feelers, and vast narrow wings. Shells and bullets slow him down. Nothing stops him."
 eldritch_nyarlathotep_incarnate:0 "Nyarlathotep, the Crawling Chaos"
 eldritch_nyarlathotep_incarnate_desc:0 "The god takes whatever form will cause the most terror: a three-lobed burning eye, a faceless sphinx, a towering column of black smoke. Enemy soldiers turn on each other just to escape it."
 eldritch_hastur_incarnate:0 "Hastur, the King in Yellow"
 eldritch_hastur_incarnate_desc:0 "A towering figure in tattered yellow robes, wearing a mask that is not a mask. Armies that look at it lose the will to fight."
 eldritch_shub_niggurath_incarnate:0 "Shub-Niggurath, the Black Goat"
 eldritch_shub_niggurath_incarnate_desc:0 "A cloud-like mass of ropy black tentacles, slavering mouths and stamping hooves. It spawns new young even as it fights."
 eldritch_yog_sothoth_incarnate:0 "Yog-Sothoth, the All-in-One"
 eldritch_yog_sothoth_incarnate_desc:0 "A conglomeration of iridescent globes that exists in every moment at once. It is wherever the enemy is about to be."
 eldritch_azathoth_incarnate:0 "Fragment of Azathoth"
 eldritch_azathoth_incarnate_desc:0 "A shard of the blind idiot god, boiling with primordial nuclear chaos. Where it passes, matter itself comes apart."

