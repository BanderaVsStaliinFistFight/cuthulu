 ################################################################
 # DECISIONS - THE FORBIDDEN LORE & SUMMONINGS
 ################################################################

 eldritch_seek_forbidden_lore:0 "Seek the Forbidden Lore"
 eldritch_seek_forbidden_lore_desc:0 "People talk of a book bound in something that is not leather, the verses of a mad poet copied by monks who later put out their own eyes. Our agents could find a copy: in the restricted stacks of Miskatonic University, in a bazaar in Sana'a, in a crypt under Prague. Once we read it, there is no going back.\n\n§RFinding it reveals the summoning rituals of three Old Ones. Only ONE of them can ever be bound to [ROOT.GetNameDef].§!"

 eldritch_summon_cthulhu:0 "Summon Cthulhu, the Dreamer in R'lyeh"
 eldritch_summon_cthulhu_desc:0 "§RPh'nglui mglw'nafh Cthulhu R'lyeh wgah'nagl fhtagn.§!\nIn his house at R'lyeh, dead Cthulhu waits dreaming. At the darkest tide our priests will go down to the sea and sing the words until the drowned city answers.\n\nCthulhu favours §Rnavies and invasions from the sea§!, and sends the amphibious §RDeep Ones§! and the colossal §RStar-Spawn§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_hastur:0 "Summon Hastur, the King in Yellow"
 eldritch_summon_hastur_desc:0 "§RAlong the shore the cloud waves break, the twin suns sink behind the lake.§!\nWe will stage the forbidden play in full, all the way to the second act. When the Stranger takes off his mask, the King in Yellow will have come to [ROOT.GetNameDef].\n\nHastur favours §Rmorale and the air§!, and lends fanatical §RZealots of the Yellow Sign§! and winged §RByakhee Riders§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"
 eldritch_summon_azathoth:0 "Summon Azathoth, the Daemon Sultan"
 eldritch_summon_azathoth_desc:0 "At the centre of all infinity, the blind idiot god Azathoth gnaws hungrily in unlit chambers beyond time, lulled by the thin, monotonous whine of accursed flutes. Calling him is madness. Calling him works.\n\nAzathoth offers §Rpure destruction§!: unmatched §Rattack and breakthrough§!, the §RSpawn of the Nuclear Chaos§! and the §RVoid Pipers§!. The price is our nation's §Rstability§!.\n\n§RThis choice is final. All other summonings will be closed forever.§!"

 ################################################################
 # DECISIONS - COMMON RITES
 ################################################################

 eldritch_rite_of_worship:0 "Hold a Rite of Worship"
 eldritch_rite_of_worship_desc:0 "Black tallow candles, an altar of unknown stone, and chanting in a language no human throat was made for. The rite is unpleasant, but [ROOT.GetEldritchGodName] is listening."
 eldritch_blood_sacrifice:0 "Offer a Blood Sacrifice"
 eldritch_blood_sacrifice_desc:0 "Prayer alone does not sustain [ROOT.GetEldritchGodName]. The conscription offices will send some of their intake to the temple instead of the barracks. Nobody will ask questions. Nobody who asks will be heard from again."
 eldritch_deepen_pact_2:0 "Deepen the Pact: Rouse [ROOT.GetEldritchGodName]"
 eldritch_deepen_pact_2_desc:0 "So far [ROOT.GetEldritchGodName] has given us only a fraction of its attention. A grander rite, held over many nights, will draw its gaze fully onto [ROOT.GetNameDef].\n\n§RRaises the pact to Tier II: a stronger national spirit, stronger eldritch battalions, more Favor each month, and access to the god's Avatar.§!"
 eldritch_deepen_pact_3:0 "Deepen the Pact: [ROOT.GetEldritchGodName] Ascendant"
 eldritch_deepen_pact_3_desc:0 "The final rite. When it is done, [ROOT.GetEldritchGodName] will not merely favour [ROOT.GetNameDef]; it will walk beside us. The world will notice.\n\n§RRaises the pact to Tier III: the ultimate national spirit, the strongest eldritch battalions, the most Favor each month, and a unique gift from the god.§!"
 eldritch_anoint_general:0 "Anoint a Champion of [ROOT.GetEldritchGodName]"
 eldritch_anoint_general_desc:0 "One of our commanders will be taken to the inner sanctum and shown what lies behind the veil. Most survive, and those who do lead with terrible certainty.\n\n§RAn un-anointed general gains the patron's blessing trait. Field marshals are chosen first.§!"
 eldritch_anoint_admiral:0 "Anoint an Admiral of [ROOT.GetEldritchGodName]"
 eldritch_anoint_admiral_desc:0 "The sea is older than the land, and it remembers the Old Ones. One of our admirals will be blessed so that the deep waters fight for us.\n\n§RAn un-anointed admiral gains the patron's blessing trait.§!"
 eldritch_exalt_prophet:0 "Exalt the Prophet"
 eldritch_exalt_prophet_desc:0 "[ROOT.GetLeader] has led us into this pact. Now [ROOT.GetEldritchGodName] will mark our leader as its chosen voice on Earth.\n\n§RThe current leader gains the patron's Herald and Chosen traits. If a new leader takes power, they can be exalted as well once this rite is available again.§!"
 eldritch_call_servitors:0 "Call Forth the Servitors"
 eldritch_call_servitors_desc:0 "The servants of [ROOT.GetEldritchGodName] are numberless, and the god will lend them to its faithful for a price.\n\n§RTwo veteran divisions of the god's locked template appear near our capital.§!"
 eldritch_incarnate_god:0 "Incarnate [ROOT.GetEldritchGodName] in the Flesh"
 eldritch_incarnate_god_desc:0 "The servants are not enough. Over thirty nights, the full congregation of [ROOT.GetNameDef] will chant [ROOT.GetEldritchGodName] into a body that can walk the earth and fight beside our armies.\n\n§RSpawns the god itself as one veteran division: a single colossal god battalion that is the whole division, with two thousand strength, enormous organization, attack, defense, breakthrough and piercing, 90% hardness, and its own recon and initiative. Two servitor divisions come with it. While it lives, our armies fight harder and every nation at war with us is gripped by dread. The god cannot be trained or added to other templates. Only one incarnation can walk the earth at a time: once it is destroyed, it can be incarnated again, at most once a year.§!\n§RZeal§! check: a pleased god returns some of the offering."

 ################################################################
 # DECISIONS - CTHULHU
 ################################################################

 eldritch_cthulhu_tide_blessing:0 "Beseech the Tide of R'lyeh"
 eldritch_cthulhu_tide_blessing_desc:0 "Ask the Dreamer to send his dreams into the sea. For a season the waves will favour our ships and our landings, and the enemy's sailors will wake screaming."
 eldritch_cthulhu_avatar:0 "Raise Father Dagon and Mother Hydra"
 eldritch_cthulhu_avatar_desc:0 "Two ancient Deep Ones, vast with age, rule the hybrid cities under the waves. They will rise to command our fleets and armies.\n\n§RCreates a unique admiral and a unique field marshal.§!"
 eldritch_cthulhu_send_nightmares:0 "Send Nightmares to [From.GetNameDef]"
 eldritch_cthulhu_send_nightmares_desc:0 "Artists, poets and sensitive souls across [From.GetNameDef] will dream of a green, slimy city of impossible angles. Some of them will not stop screaming.\n\n§RPlaces the 'Dreams of R'lyeh' curse on the enemy for 90 days.§!\n§RLore§! check: the curse lasts 90 days in full, or 45 on a failure."

 ################################################################
 # DECISIONS - HASTUR
 ################################################################

 eldritch_hastur_sign_blessing:0 "Unveil the Yellow Sign"
 eldritch_hastur_sign_blessing_desc:0 "The Yellow Sign will be painted on every banner and every wing. Those who see it will follow it without fear or hesitation."
 eldritch_hastur_avatar:0 "Invite the Stranger in the Pallid Mask"
 eldritch_hastur_avatar_desc:0 "'You, sir, should unmask.' 'Indeed?' 'Indeed it's time. We all have laid aside disguise but you.' 'I wear no mask.'\n\n§RCreates a unique field marshal.§!"
 eldritch_hastur_stage_play:0 "Stage 'The King in Yellow' in [From.GetNameDef]"
 eldritch_hastur_stage_play_desc:0 "A touring company will perform the forbidden play in the theatres of [From.GetNameDef]. The first act is harmless. Nobody who sees the second act is ever the same.\n\n§RPlaces 'The Yellow Madness' curse on the enemy for 90 days.§!\n§RLore§! check: the curse lasts 90 days in full, or 45 on a failure."

 ################################################################

 ################################################################
 # DECISIONS - AZATHOTH
 ################################################################

 eldritch_azathoth_fury_blessing:0 "Dance to the Daemon Flutes"
 eldritch_azathoth_fury_blessing_desc:0 "Play the thin, monotonous piping of the Outer Void over every radio set in the army. The men will fight like the ones who dance around the Daemon Sultan's throne: without thought, without fear, without mercy."
 eldritch_azathoth_avatar:0 "Summon the Piper of the Void"
 eldritch_azathoth_avatar_desc:0 "One of the mindless flute-players from the court of Azathoth has stepped into our world. It does not speak. It plays, and armies march to its tune.\n\n§RCreates a unique field marshal.§!"
 eldritch_azathoth_nuclear_chaos:0 "Bottle the Nuclear Chaos"
 eldritch_azathoth_nuclear_chaos_desc:0 "Azathoth is the nuclear chaos at the heart of all things. A tiny fragment of it, sealed in lead, will destroy any city on Earth.\n\n§RGrants a nuclear bomb.§!"

 ################################################################
 # DECISIONS - THE PROPHET
 ################################################################

 eldritch_prophet_record:0 "The Prophet's Record"
 eldritch_prophet_record_desc:0 "Every rite leaves its mark on the one who leads it. The cult keeps a record of what the Prophet has learned, endured and become.\n\n§ROpens the Prophet's character sheet: level, experience and the three stats, Lore, Zeal and Will. Spend Insight there.§!"
 eldritch_prophet_commune:0 "Commune with [ROOT.GetEldritchGodName]"
 eldritch_prophet_commune_desc:0 "[ROOT.GetLeader] will go down alone into the sanctum beneath the capital, and for ten days nobody will see or hear from them. Those who have done this before describe it as drowning in a voice.\n\n§RAfter 10 days the Prophet asks for strength (army and navy experience), knowledge (research bonuses) or simply listens (Favor). A §RWill§! check decides whether the Prophet comes back changed.§!"
 eldritch_prophet_preach:0 "Preach to the Faithful"
 eldritch_prophet_preach_desc:0 "The pact has frightened the people. [ROOT.GetLeader] will stand on the palace balcony and tell them what [ROOT.GetEldritchGodName] has promised, and the crowd will go home calmer, and a little stranger.\n\n§RStability and war support. The god's Chosen preaches better.§!\n§RZeal§! check: a roused crowd brings more war support."
 eldritch_prophet_tithe:0 "Demand a Tithe from the Cult"
 eldritch_prophet_tithe_desc:0 "The cult has grown rich on offerings. [ROOT.GetLeader] will remind its priests who leads this nation, and the money will find its way into the treasury.\n\n§RTurns Favor into political power.§!"
 eldritch_prophet_dark_council:0 "Convene the Dark Council"
 eldritch_prophet_dark_council_desc:0 "[ROOT.GetLeader] will sit at the head of a long table in a windowless room. Around it will sit the generals and admirals [ROOT.GetEldritchGodName] has touched and, if one has come, an avatar of the god itself. What they plan there will not be written down.\n\n§RNeeds an anointed general or admiral, or an avatar. 120 days of faster, deeper planning and better organization, plus command power (more if an avatar attends).§!"
 eldritch_prophet_review_servitors:0 "Review the Servitor Legions"
 eldritch_prophet_review_servitors_desc:0 "[ROOT.GetLeader] will ride out to the front and inspect the servants of [ROOT.GetEldritchGodName] in person. The newspapers will print the photographs, though the editors will crop them carefully.\n\n§RNeeds eldritch battalions in the field. Army experience, war support and a little Favor.§!"
 eldritch_prophet_march_with_god:0 "March Beside [ROOT.GetEldritchGodName]"
 eldritch_prophet_march_with_god_desc:0 "The god walks among our soldiers. [ROOT.GetLeader] will walk with it, at the head of the army, where every soldier can see that their leader is not afraid.\n\n§RNeeds the incarnate god on the map. 90 days of better attack and morale.§!"
 eldritch_prophet_name_the_cursed:0 "Speak the Name of [From.GetNameDef]"
 eldritch_prophet_name_the_cursed_desc:0 "The curse we laid on [From.GetNameDef] is fading. In the next rite, [ROOT.GetLeader] will speak the enemy's name aloud, and the madness will come back.\n\n§RThe enemy's curse lasts 60 days longer, and it loses war support.§!"
 eldritch_prophet_great_temple:0 "Raise the Great Temple"
 eldritch_prophet_great_temple_desc:0 "[ROOT.GetLeader] will lay the first stone of a temple to [ROOT.GetEldritchGodName] in the heart of the capital. Its architects have stopped sleeping, and its angles do not quite meet.\n\n§RA 90-day construction. The Great Temple adds stability and political power, and §G3§! Eldritch Favor every month for the rest of the game. Once per game.§!"
 eldritch_prophet_become_vessel:0 "Become the Vessel"
 eldritch_prophet_become_vessel_desc:0 "[ROOT.GetEldritchGodName] has asked for the last thing [ROOT.GetLeader] has left to give. For sixty days the Prophet will lie in the sanctum while the god pours itself in. What comes out will still lead the nation. It will not be entirely human.\n\n§RNeeds an Ascendant pact and a Chosen leader. The leader gains the god's powerful §RVessel§! trait; the nation loses stability and gains war support, and the whole world will hear of it. Once per game; the trait is lost if the leader is replaced.§!\n§RWill§! check: a Prophet who keeps hold of their mind halves the stability loss."

 eldritch_perk_lore_1:0 "Lore: The Pnakotic Fragments"
 eldritch_perk_lore_1_desc:0 "The oldest pages in the cult's library were written before there were humans to read them. The Prophet has learned to read them anyway."
 eldritch_perk_lore_2:0 "Lore: Curses That Linger"
 eldritch_perk_lore_2_desc:0 "A curse is a word that keeps being spoken. The Prophet has learned how to make it echo."
 eldritch_perk_lore_3:0 "Lore: Forbidden Science"
 eldritch_perk_lore_3_desc:0 "The Prophet takes the nation's scientists into the sanctum, one at a time. They come out knowing things."
 eldritch_perk_zeal_1:0 "Zeal: The Fervent Host"
 eldritch_perk_zeal_1_desc:0 "The servitors have seen the Prophet bleed for the god, and now they will bleed for the Prophet."
 eldritch_perk_zeal_2:0 "Zeal: The Prophet's Banner"
 eldritch_perk_zeal_2_desc:0 "Wherever the Prophet's banner goes, the faithful follow, and they follow faster."
 eldritch_perk_zeal_3:0 "Zeal: Voice of the God"
 eldritch_perk_zeal_3_desc:0 "When the Prophet speaks, the god listens. On the battlefield, it fights for that voice."
 eldritch_perk_will_1:0 "Will: Iron Composure"
 eldritch_perk_will_1_desc:0 "The Prophet has stared into the abyss long enough to stop flinching."
 eldritch_perk_will_2:0 "Will: The Elder Sign"
 eldritch_perk_will_2_desc:0 "The Prophet carves the five-pointed sign over every door of the capital. The servants of other gods cannot pass it."
 eldritch_perk_will_3:0 "Will: Apostolic Succession"
 eldritch_perk_will_3_desc:0 "The god no longer waits to be asked. Whoever leads [ROOT.GetNameDef] next will wake up already marked."

 ################################################################
 # NATIONAL SPIRITS
 ################################################################

 eldritch_cthulhu_pact_1:0 "Pact of the Sleeping God"
 eldritch_cthulhu_pact_1_desc:0 "Cthulhu dreams, and his dreams have turned toward us. Our shipwrights work faster, our sailors fight harder, and the coastal towns have strange new neighbours."
 eldritch_cthulhu_pact_2:0 "Stirrings in R'lyeh"
 eldritch_cthulhu_pact_2_desc:0 "Earthquakes in the South Pacific. Fishermen pull up carvings that no human hand made. The Dreamer is turning in his sleep."
 eldritch_cthulhu_pact_3:0 "Cthulhu Fhtagn"
 eldritch_cthulhu_pact_3_desc:0 "R'lyeh has risen. Its non-Euclidean towers glisten above the waves, and every Deep One in every ocean answers our call."
 eldritch_cthulhu_blessing:0 "Tide of R'lyeh"
 eldritch_cthulhu_blessing_desc:0 "The sea itself has taken our side."
 eldritch_curse_dreams_of_rlyeh:0 "Dreams of R'lyeh"
 eldritch_curse_dreams_of_rlyeh_desc:0 "Across the nation, sensitive minds are plagued by visions of a drowned city. Asylums are full, and the government cannot think straight."

 eldritch_hastur_pact_1:0 "Pact of the King in Yellow"
 eldritch_hastur_pact_1_desc:0 "Copies of an unpublished play circulate among our officers. The Yellow Sign is chalked on barrack walls."
 eldritch_hastur_pact_2:0 "The Yellow Sign Spreads"
 eldritch_hastur_pact_2_desc:0 "Black stars burn in the evening sky over our airfields. Our pilots claim the Byakhee fly beside them."
 eldritch_hastur_pact_3:0 "Carcosa Ascendant"
 eldritch_hastur_pact_3_desc:0 "Lost Carcosa lies over our capital like a veil. Strange is the night where black stars rise, and stranger still are the soldiers who march beneath them."
 eldritch_hastur_blessing:0 "The Yellow Sign Unveiled"
 eldritch_hastur_blessing_desc:0 "Every soldier who has seen the Sign would sooner die than retreat."
 eldritch_curse_yellow_madness:0 "The Yellow Madness"
 eldritch_curse_yellow_madness_desc:0 "Soldiers who saw the forbidden play desert their posts to look for Carcosa. Officers write letters to a king who does not exist."

 eldritch_azathoth_pact_1:0 "Pact of the Daemon Sultan"
 eldritch_azathoth_pact_1_desc:0 "Somewhere at the centre of the universe, the blind god has turned its idiot attention toward us. Our soldiers fight with a terrible, joyless fury."
 eldritch_azathoth_pact_2:0 "The Piping Grows Louder"
 eldritch_azathoth_pact_2_desc:0 "Factory workers hear thin flute music over the machines. They work until they collapse, and production soars."
 eldritch_azathoth_pact_3:0 "The Nuclear Chaos Unbound"
 eldritch_azathoth_pact_3_desc:0 "We have opened a door onto the boiling heart of creation. Nothing can stand against us, and nothing in our own nation is stable any more."
 eldritch_azathoth_blessing:0 "Mindless Fury"
 eldritch_azathoth_blessing_desc:0 "The army fights like the dancers around the throne of chaos."

 eldritch_prophets_fever:0 "The Prophet's Fever"
 eldritch_prophets_fever_desc:0 "Our leader has not slept since the trance. The speeches are longer now, and some of them are not in any human language. The crowds love it."
 eldritch_dark_council:0 "The Dark Council"
 eldritch_dark_council_desc:0 "The anointed commanders meet in a room without windows. The plans they bring out are uncannily good."
 eldritch_prophet_marches:0 "The Prophet Marches with the God"
 eldritch_prophet_marches_desc:0 "Our leader walks at the head of the army beside the god itself. No soldier will retreat while they can see that."
 eldritch_great_temple:0 "The Great Temple"
 eldritch_great_temple_desc:0 "A temple to our patron towers over the capital. The faithful come by the thousand, and something answers from inside it."
 eldritch_god_walks:0 "A God Walks Among Us"
 eldritch_god_walks_desc:0 "Our soldiers have seen what marches with them. No army of men can frighten them now.\n\n§RLasts while the incarnate god's division is on the map (checked every month).§!"
 eldritch_dread_of_the_god:0 "Dread of the Incarnate"
 eldritch_dread_of_the_god_desc:0 "Somewhere on the front, something that should not exist is walking towards our lines. The men can feel it before they see it, and many do not wait to see it."
 eldritch_prophet_mantle:0 "The Prophet's Mantle"
 eldritch_prophet_mantle_desc:0 "The cult's chosen voice carries everything the rites have taught it."
 eldritch_prophet_mantle_tt:0 "Grows with the Prophet's §RLore§!, §RZeal§! and §RWill§! (2% per point). Lapses while the leader does not bear the god's mark."

 ################################################################
 # COUNTRY LEADER TRAITS
 ################################################################

 eldritch_cthulhu_herald:0 "Dreamer of R'lyeh"
 eldritch_cthulhu_herald_desc:0 "Shares the dreams of the Sleeper."
 eldritch_cthulhu_chosen:0 "Voice of the Sleeper"
 eldritch_cthulhu_chosen_desc:0 "Speaks with the voice of Cthulhu himself."
 eldritch_hastur_herald:0 "Bearer of the Yellow Sign"
 eldritch_hastur_herald_desc:0 "Has seen the Sign and understood it."
 eldritch_hastur_chosen:0 "Prince of Carcosa"
 eldritch_hastur_chosen_desc:0 "Heir to the tattered throne of the King in Yellow."
 eldritch_azathoth_herald:0 "Herald of the Daemon Sultan"
 eldritch_azathoth_herald_desc:0 "Announces the coming of chaos."
 eldritch_azathoth_chosen:0 "Piper at the Throne of Chaos"
 eldritch_azathoth_chosen_desc:0 "Plays the flute that lulls the idiot god."

 eldritch_cthulhu_vessel:0 "Flesh of the Sleeper"
 eldritch_cthulhu_vessel_desc:0 "Gills have opened along the Prophet's throat. They dream Cthulhu's dreams while awake."
 eldritch_hastur_vessel:0 "The Pallid Mask"
 eldritch_hastur_vessel_desc:0 "The Prophet no longer takes off the mask. Perhaps they no longer can."
 eldritch_azathoth_vessel:0 "Seat of the Daemon Sultan"
 eldritch_azathoth_vessel_desc:0 "A thin piping follows the Prophet everywhere. Nobody near them can think clearly, and nobody needs to."

 ################################################################
 # GENERAL & ADMIRAL TRAITS
 ################################################################

 eldritch_cthulhu_general:0 "Deep-Touched"
 eldritch_cthulhu_general_desc:0 "Has walked the streets of drowned R'lyeh and returned. Excels at landings from the sea."
 eldritch_cthulhu_admiral:0 "Admiral of the Drowned Fleet"
 eldritch_cthulhu_admiral_desc:0 "The Deep Ones guide this admiral's torpedoes."
 eldritch_hastur_general:0 "Gazer upon the Yellow Sign"
 eldritch_hastur_general_desc:0 "Troops under this general fear their commander more than the enemy."
 eldritch_hastur_admiral:0 "Sailor of the Lake of Hali"
 eldritch_hastur_admiral_desc:0 "Has sailed the cloud-waves of Hali, beneath the twin suns."
 eldritch_azathoth_general:0 "Mad with Chaos"
 eldritch_azathoth_general_desc:0 "Attacks always and everywhere, with no thought for defense."
 eldritch_azathoth_admiral:0 "Captain of the Void"
 eldritch_azathoth_admiral_desc:0 "Fights with a reckless frenzy that terrifies friend and foe alike."
 eldritch_avatar_land:0 "Avatar of the Old Ones"
 eldritch_avatar_land_desc:0 "Not human, and never was."
 eldritch_avatar_navy:0 "Avatar of the Deep"
 eldritch_avatar_navy_desc:0 "Not human, and never was."

 ################################################################
 # BATTALIONS
 ################################################################

 eldritch_deep_one_brood:0 "Deep One Brood"
 eldritch_deep_one_brood_desc:0 "Fish-eyed, gilled, and immortal unless killed, the Deep Ones are born for assaults from the sea and across rivers."
 eldritch_star_spawn:0 "Star-Spawn of Cthulhu"
 eldritch_star_spawn_desc:0 "Towering kin of the Dreamer that arrived from the stars long before mankind. Few in number, vast in strength."
 eldritch_yellow_zealots:0 "Zealots of the Yellow Sign"
 eldritch_yellow_zealots_desc:0 "Fanatics who have read the play to its end. They know no fear and do not break."
 eldritch_byakhee_riders:0 "Byakhee Riders"
 eldritch_byakhee_riders_desc:0 "Shock troops carried into battle on the leathery wings of Hastur's servitors. Can be dropped behind enemy lines like paratroopers."

 eldritch_lidless:0 "The Lidless"
 eldritch_lidless_desc:0 "Once soldiers have seen the Yellow Sign on the inside of their eyelids, they see it every time they blink. The Lidless found the only cure: they cut the eyelids off. They have not slept since, their eyes have dried as yellow as old paper, and nothing crosses no man's land without them seeing it. Superb defenders."
 eldritch_audience:0 "The Audience"
 eldritch_audience_desc:0 "They were in the house the night the second act was performed in full, and they have not stopped applauding since. They march in the rotting evening clothes they wore to the theatre, still clapping, still smiling at a stage only they can see, and they go on clapping when they are shot. Poorly armed and quick to raise, they come in their thousands, and they never break."
 eldritch_cassildas_choir:0 "Cassilda's Choir"
 eldritch_cassildas_choir_desc:0 "Choristers who sing Cassilda's song from the shore of Lake Hali, over and over, with their mouths sewn shut. The song comes out anyway. The guns behind them fire in time with it, and when our men take the enemy's trenches they find the defenders have punctured their own eardrums with pencils. Artillery that tears at the enemy from afar."
 eldritch_pallid_masks:0 "The Pallid Masks"
 eldritch_pallid_masks_desc:0 "At midnight the court of Carcosa unmasked, as the play demands. These did not, because they could not: the pale masks have grown into the bone. A field surgeon once cut one away and found another mask beneath it, paler than the first, and another beneath that. They lead every assault, and the enemy swears the masks are smiling."
 eldritch_kings_tatters:0 "The King's Tatters"
 eldritch_kings_tatters_desc:0 "When the King walked through the capital, the hem of his tattered robe dragged across the kneeling crowd, and every rag that tore loose took someone with it. The rags walk on their own now, wound tight around whatever is left of the people they took. Bullets pass through the cloth and find nothing to hit. Slow, hard to kill, and terrible in the attack."
 eldritch_halis_drowned:0 "Hali's Drowned"
 eldritch_halis_drowned_desc:0 "Not everyone who set out across Lake Hali reached the far shore. The lake gives them back, grey and swollen, with black water still running from their mouths, and they walk out of rivers and the sea as if they had never left it. They do not breathe and do not need to. When they speak, it is only to sing the song of the shore. Superb at crossing rivers and storming beaches."
 eldritch_chaos_spawn:0 "Spawn of the Nuclear Chaos"
 eldritch_chaos_spawn_desc:0 "Warped fragments of the primordial chaos, shaped roughly into soldiers. They hit hard and do not care about anything else."
 eldritch_void_pipers:0 "Void Pipers"
 eldritch_void_pipers_desc:0 "Amorphous flute-players whose maddening piping tears at enemy lines from afar."

 eldritch_cthulhu_incarnate:0 "Great Cthulhu"
 eldritch_cthulhu_incarnate_desc:0 "A mountain of green, rubbery flesh with an octopus head, a mass of feelers, and vast narrow wings. Shells and bullets slow him down. Nothing stops him."
 eldritch_hastur_incarnate:0 "Hastur, the King in Yellow"
 eldritch_hastur_incarnate_desc:0 "A towering figure in tattered yellow robes, wearing a mask that is not a mask. Armies that look at it lose the will to fight. Twice as mighty as any other god, he walks only for Carcosa."
 eldritch_azathoth_incarnate:0 "Fragment of Azathoth"
 eldritch_azathoth_incarnate_desc:0 "A shard of the blind idiot god, boiling with primordial nuclear chaos. Where it passes, matter itself comes apart."

 ################################################################
 # HIDDEN RITE TECHNOLOGIES
 ################################################################

 eldritch_cthulhu_rites_1:0 "Rites of R'lyeh"
 eldritch_cthulhu_rites_1_desc:0 "The secrets of the Deep Ones."
 eldritch_cthulhu_rites_2:0 "Rites of R'lyeh II"
 eldritch_cthulhu_rites_2_desc:0 "The secrets of the Deep Ones."
 eldritch_cthulhu_rites_3:0 "Rites of R'lyeh III"
 eldritch_cthulhu_rites_3_desc:0 "The secrets of the Deep Ones."
 eldritch_hastur_rites_1:0 "Rites of Carcosa"
 eldritch_hastur_rites_1_desc:0 "The secrets of the Yellow Sign."
 eldritch_hastur_rites_2:0 "Rites of Carcosa II"
 eldritch_hastur_rites_2_desc:0 "The secrets of the Yellow Sign."
 eldritch_hastur_rites_3:0 "Rites of Carcosa III"
 eldritch_hastur_rites_3_desc:0 "The secrets of the Yellow Sign."
 eldritch_hastur_unlock_lidless:0 "The Lidless"
 eldritch_hastur_unlock_lidless_desc:0 "Earned on the Road to Carcosa: Have You Seen the Yellow Sign?"
 eldritch_hastur_unlock_audience:0 "The Audience"
 eldritch_hastur_unlock_audience_desc:0 "Earned by staging the full play."
 eldritch_hastur_unlock_cassildas_choir:0 "Cassilda's Choir"
 eldritch_hastur_unlock_cassildas_choir_desc:0 "Earned on the Road to Carcosa: Cassilda's Song."
 eldritch_hastur_unlock_pallid_masks:0 "The Pallid Masks"
 eldritch_hastur_unlock_pallid_masks_desc:0 "Earned on the Road to Carcosa: The Stranger in the Pallid Mask."
 eldritch_hastur_unlock_kings_tatters:0 "The King's Tatters"
 eldritch_hastur_unlock_kings_tatters_desc:0 "Earned on the Road to Carcosa: The King Walks."
 eldritch_hastur_unlock_halis_drowned:0 "Hali's Drowned"
 eldritch_hastur_unlock_halis_drowned_desc:0 "Earned on the Road to Carcosa: The Throne of Carcosa."
 eldritch_azathoth_rites_1:0 "Rites of the Daemon Sultan"
 eldritch_azathoth_rites_1_desc:0 "The secrets of the Nuclear Chaos."
 eldritch_azathoth_rites_2:0 "Rites of the Daemon Sultan II"
 eldritch_azathoth_rites_2_desc:0 "The secrets of the Nuclear Chaos."
 eldritch_azathoth_rites_3:0 "Rites of the Daemon Sultan III"
 eldritch_azathoth_rites_3_desc:0 "The secrets of the Nuclear Chaos."
 eldritch_cthulhu_incarnation:0 "Incarnation of Cthulhu"
 eldritch_cthulhu_incarnation_desc:0 "The Dreamer wears flesh."
 eldritch_hastur_incarnation:0 "Incarnation of Hastur"
 eldritch_hastur_incarnation_desc:0 "The King in Yellow wears flesh."
 eldritch_azathoth_incarnation:0 "Incarnation of Azathoth"
 eldritch_azathoth_incarnation_desc:0 "The Daemon Sultan wears flesh."

 ################################################################
 # EVENTS
 ################################################################

 eldritch.1.t:0 "The Forbidden Lore"
 eldritch.1.d:0 "Our agents have come back. Three of the five who went, anyway, and one of those three has not stopped whispering since. They brought a book: a thick, crumbling volume whose pages feel warm to the touch, its margins crowded with notes in a dozen hands and a dozen languages.\n\nThe translators worked in shifts so that no one read too much at once. What they found were rituals. Three of them, each one calling something vast and old that has waited since before the first human looked at the stars.\n\nThe book is clear on one point above all: a nation can be bound to only one of them."
 eldritch.1.a:0 "That is not dead which can eternal lie..."

 eldritch.2.t:0 "Eldritch Pacts Is Active"
 eldritch.2.d:0 "The Old Ones are listening.\n\nTo begin, open the §RDecisions§! tab (the button in the top-left corner of the screen) and find the category §RThe Forbidden Rites§!. Take §RSeek the Forbidden Lore§! to reveal the three summoning rituals.\n\nYou can bind only §Rone§! god. Choose carefully."
 eldritch.2.a:0 "Ph'nglui mglw'nafh..."

 eldritch.11.t:0 "Cthulhu Answers"
 eldritch.11.d:0 "On the sixtieth night of the ritual the sea went still. Then, far out past the breakwater, it began to boil. The priests on the shore kept chanting while green light rose from the depths, and the shapes that came out of the surf walked on two legs.\n\nThey are the Deep Ones, and they have come to serve. Somewhere in the South Pacific a sunken city has felt our call, and in his house at R'lyeh, dead Cthulhu dreams of [ROOT.GetNameDef]."
 eldritch.11.a:0 "Cthulhu fhtagn!"
 eldritch.13.t:0 "Have You Seen the Yellow Sign?"
 eldritch.13.d:0 "The play reached its second act. In the hush that followed the final line, the Stranger in the Pallid Mask stepped onto the stage, and behind him, faint as a reflection, a city of twin suns and black stars hung over the audience.\n\nNobody left the theatre. When the doors opened at dawn, every member of the audience was wearing the Yellow Sign, and every one of them was smiling. Hastur, the King in Yellow, has claimed [ROOT.GetNameDef]."
 eldritch.13.a:0 "Hail the King in Yellow!"
 eldritch.16.t:0 "The Daemon Sultan Stirs"
 eldritch.16.d:0 "On the sixtieth night, the flutes began. Nobody brought them and nobody was playing them, but every person within ten miles heard the thin, monotonous whine. The ritual chamber, the temple and the hill it stood on are gone, replaced by a perfectly round crater still glowing faintly at the bottom.\n\nAt the centre of all infinity, the blind idiot god Azathoth has turned in our direction. Our soldiers have begun to march in time with music that is not there."
 eldritch.16.a:0 "Let the piping never cease."

 eldritch.20.t:0 "The Pact Deepens"
 eldritch.20.d.cthulhu:0 "Seismographs across the Pacific are recording tremors from a point where no fault line should be. Fishing fleets refuse to sail. Cthulhu is stirring, and his attention on [ROOT.GetNameDef] is no longer a dream."
 eldritch.20.d.hastur:0 "Black stars are visible over the capital in broad daylight now. The Yellow Sign hangs in every barracks, and no soldier will look away from it. Hastur's gaze has settled on [ROOT.GetNameDef]."
 eldritch.20.d.azathoth:0 "The piping can be heard in every factory and every barracks. Workers do not sleep and soldiers do not rest. Azathoth's mindless attention has fully settled on [ROOT.GetNameDef]."
 eldritch.20.a:0 "Our god draws nearer."

 eldritch.30.t:0 "The Old One Ascendant"
 eldritch.30.d.cthulhu:0 "R'lyeh has risen. Its slimy green towers break the surface of the Pacific, and its great door stands open. Cthulhu walks again. His dreams have become waking orders, and [ROOT.GetNameDef] is his chosen nation on Earth."
 eldritch.30.d.hastur:0 "Carcosa has come. Its towers rise behind the moon, the twin suns set over our capital, and the King in Yellow sits in a tattered mantle on our throne. [ROOT.GetNameDef] now belongs to Hastur."
 eldritch.30.d.azathoth:0 "We have opened a door to the throne of chaos itself. Our weapons crackle with the energy of creation's birth, and the land shakes beneath our armies. Nobody in [ROOT.GetNameDef] sleeps, and nobody needs to."
 eldritch.30.a:0 "The stars are right!"

 eldritch.31.t:0 "Cthulhu Walks"
 eldritch.31.d:0 "The sea off our coast heaved and split. Something the size of a cathedral waded out of the surf, water pouring from its wings, and the earth shook with every step. Great Cthulhu is no longer dreaming. He has taken his place at the head of our armies, and his Deep Ones crowd around his feet."
 eldritch.31.a:0 "Cthulhu fhtagn! Cthulhu walks!"
 eldritch.33.t:0 "The King Has Come"
 eldritch.33.d:0 "The curtain fell, and when it rose again the stage had become a road, and down that road came the King in Yellow in his tattered mantle. He did not stop at the theatre door. He has walked out to the front, and our Zealots follow him singing."
 eldritch.33.a:0 "Hail the King!"
 eldritch.36.t:0 "A Shard of the Daemon Sultan"
 eldritch.36.d:0 "The flutes rose to a shriek, and the sky above the capital tore open. A sliver of the boiling chaos at the centre of all things fell through and took a shape our eyes can barely hold. It has no mind and no mercy, and for now it marches in our direction of choice."
 eldritch.36.a:0 "Point it at the enemy. Quickly."

 eldritch.40.t:0 "[ROOT.GetEldritchGodName] Demands Tribute"
 eldritch.40.d:0 "The high priests have come to the capital, pale and shaking. Their god is hungry. The offerings have been too small, the rites too infrequent, the faithful too few. [ROOT.GetEldritchGodName] expects more from its chosen nation, and it is not known for patience."
 eldritch.40.a:0 "Give it blood."
 eldritch.40.b:0 "Our statesmen will make a show of devotion."
 eldritch.40.c:0 "We will not be its cattle!"
 eldritch.40.will:0 "§R(Will 4)§! Refuse, and make the god accept it."
 eldritch.41.t:0 "A Prophet in the Streets"
 eldritch.41.d:0 "A ragged preacher is drawing huge crowds in the capital's squares. He claims [ROOT.GetEldritchGodName] speaks to him directly, and he describes our secret rites with frightening accuracy. The police ask whether he should be silenced."
 eldritch.41.a:0 "Silence the prophet. Discretion is everything."
 eldritch.41.b:0 "Let them preach. Let the people know their god."
 eldritch.41.zeal:0 "§R(Zeal 4)§! Make the street prophet one of ours."
 eldritch.42.t:0 "The Stars Are Right"
 eldritch.42.d:0 "Astronomers report an alignment of stars not seen in ten thousand years. In every temple of [ROOT.GetEldritchGodName] the candles burn black, and the faithful feel their god's attention like a weight on their shoulders."
 eldritch.42.a:0 "Iä! Iä!"
 eldritch.42.lore:0 "§R(Lore 4)§! Read what the stars are really saying."
 eldritch.43.t:0 "Dreams of the Faithful"
 eldritch.43.d:0 "Last night thousands of our soldiers had the same dream: a battle in a strange land, fought and won under the eye of [ROOT.GetEldritchGodName]. They woke knowing tactics they were never taught."
 eldritch.43.a:0 "Our god teaches well."
 eldritch.43.zeal:0 "§R(Zeal 3)§! Turn the dream into a war cry."

 eldritch.60.t:0 "Nightmares of a Drowned City"
 eldritch.60.d:0 "All over [ROOT.GetNameDef], artists, poets and the sensitive-minded are dreaming the same dream: a city of green stone and impossible angles beneath the sea, and something vast stirring inside it. The asylums are overflowing. Some say the dreams started when [From.GetNameDef] began holding strange rites on its coasts."
 eldritch.60.a:0 "It is only a dream... isn't it?"
 eldritch.61.t:0 "The King in Yellow Performed"
 eldritch.61.d:0 "A touring theatre company has been performing a play called 'The King in Yellow' in our cities. Everyone who saw the second act is deeply changed. Soldiers have deserted to look for a city called Carcosa, and officers are writing letters to a king nobody has heard of. The company's papers were issued in [From.GetNameDef]."
 eldritch.61.a:0 "Burn every copy of that play!"

 eldritch.63.t:0 "They Are Saying Our Name"
 eldritch.63.d:0 "The madness in [ROOT.GetNameDef] was finally ebbing. Then, last night, it came back worse than ever. The afflicted all describe the same thing: a voice from [From.GetNameDef], speaking our nation's name over and over in a rite, and the leader of [From.GetNameDef] smiling all the while."
 eldritch.63.a:0 "Make it stop."

 eldritch.70.t:0 "The Prophet Communes"
 eldritch.70.d:0 "On the tenth day the sanctum door opened and [ROOT.GetLeader] walked out, grey-faced and steady. [ROOT.GetEldritchGodName] had listened, the Prophet said, and would grant one thing.\n\nThe ministers waited to hear what that one thing should be.\n\n[ROOT.GetEldritchCheckLine]"
 eldritch.70.a:0 "Ask for strength for our soldiers and sailors."
 eldritch.70.b:0 "Ask for the secrets of machines and of war."
 eldritch.70.c:0 "Ask for nothing. Only listen."
 eldritch.70.lore:0 "§R(Lore 5)§! Ask to be taught, not given."
 eldritch.71.t:0 "The Prophet Returns Changed"
 eldritch.71.d:0 "The sanctum door stayed shut two days longer than planned. When the guards forced it, [ROOT.GetLeader] was sitting in the dark, speaking in a language that hurt to hear. The Prophet came out laughing, and has not stopped making speeches since.\n\nThe crowds adore the new fervour. The cabinet is frightened of it.\n\n[ROOT.GetEldritchCheckLine]"
 eldritch.71.a:0 "Let the people see their Prophet."
 eldritch.71.b:0 "Keep the Prophet out of sight until it passes."
 eldritch.71.will:0 "§R(Will 5)§! The Prophet masters the fever."
 eldritch.72.t:0 "The Vessel"
 eldritch.72.d.cthulhu:0 "When [ROOT.GetLeader] came up from the sanctum, the guards smelled the sea first. Gills had opened along the Prophet's throat, and the eyes no longer blinked. At the first cabinet meeting the ministers found they had all dreamt the same dream, of a green city under the water, and that the Prophet had been in it.\n\nCthulhu has a voice in [ROOT.GetNameDef] now, and it is our leader's."
 eldritch.72.d.hastur:0 "[ROOT.GetLeader] came out of the sanctum wearing a mask of pallid white. The Prophet will not take it off and gives no answer when asked to. The palace tailors have been ordered to dye every robe yellow.\n\nThe King in Yellow has a throne in [ROOT.GetNameDef] now."
 eldritch.72.d.azathoth:0 "The ritual ended when the sanctum's walls cracked from the inside. [ROOT.GetLeader] walked out of the rubble untouched, trailed by a thin, monotonous piping that has not stopped since. Ministers forget what they were saying in the Prophet's presence. Soldiers stop being afraid.\n\nA mote of the Daemon Sultan's chaos now rules [ROOT.GetNameDef]."
 eldritch.72.a:0 "All hail the Vessel."

 eldritch.80.t:0 "The Prophet's Record"
 eldritch.80.d:0 "§RThe Mantle of the Prophet§!\n[ROOT.GetEldritchProphetLine]\n[ROOT.GetEldritchMantleState]\n\n§RLevel§! §R[?eldritch_prophet_level|0]§!   §RExperience§! [?eldritch_prophet_xp|0] / [?eldritch_prophet_xp_next|0]\n§RInsight to spend:§! §G[?eldritch_prophet_insight|0]§!\n\n§RLore§! [?eldritch_prophet_lore|0] / 10: §G+[?eldritch_prophet_lore_pct|0]%§! research speed\nKnowledge of the rites, the old tongues and the angles between the stars.\n\n§RZeal§! [?eldritch_prophet_zeal|0] / 10: §G+[?eldritch_prophet_zeal_pct|0]%§! army attack\nThe fire that sends soldiers into battle beside things that are not human.\n\n§RWill§! [?eldritch_prophet_will|0] / 10: §G+[?eldritch_prophet_will_pct|0]%§! stability\nWhat is left of the Prophet's own mind, and the nation's faith in it.\n\n§RSkill checks§! (the odds of each roll)\nCommune, §RWill§!: [?eldritch_odds_commune|0]%   Curses, §RLore§!: [?eldritch_odds_curse|0]%\nPreach, §RZeal§!: [?eldritch_odds_preach|0]%   Incarnation, §RZeal§!: [?eldritch_odds_incarnate|0]%   Vessel, §RWill§!: [?eldritch_odds_vessel|0]%\nSome events also offer choices that only a Prophet with enough Lore, Zeal or Will can make.\n\n§RPaths:§! Lore [?eldritch_path_lore|0]/3, Zeal [?eldritch_path_zeal|0]/3, Will [?eldritch_path_will|0]/3. Spend Insight on perks in §RThe Prophet's Path§!.\n§RQuests completed:§! [?eldritch_quests_done|0]\n\nThe Prophet gains experience from every rite of the pact, and more from the great ones. Each level brings a point of Insight."
 eldritch.80.lore:0 "Study the forbidden texts (+1 Lore)"
 eldritch.80.zeal:0 "Stoke the fire (+1 Zeal)"
 eldritch.80.will:0 "Steel the mind (+1 Will)"
 eldritch.80.close:0 "Close the record."
 eldritch.81.t:0 "The Prophet Grows"
 eldritch.81.d:0 "Rite by rite, [ROOT.GetLeader] has drawn deeper from the well that [ROOT.GetEldritchGodName] opened. The mantle sits heavier on the Prophet's shoulders now, and fits better.\n\n§RLevel§! §R[?eldritch_prophet_level|0]§! reached.   §RInsight to spend:§! §G[?eldritch_prophet_insight|0]§!"
 eldritch.81.lore:0 "Study the forbidden texts (+1 Lore)"
 eldritch.81.zeal:0 "Stoke the fire (+1 Zeal)"
 eldritch.81.will:0 "Steel the mind (+1 Will)"
 eldritch.81.keep:0 "Keep the Insight for later."
 eldritch.82.t:0 "[ROOT.GetEldritchCheckTitle]"
 eldritch.82.d.curse_pass:0 "[ROOT.GetEldritchCheckLine]\n\n[ROOT.GetLeader] spoke every word of the rite without a stumble, in a voice that did not sound like the Prophet's own. Far away, the curse has settled over its target in full."
 eldritch.82.d.curse_fail:0 "[ROOT.GetEldritchCheckLine]\n\nHalfway through the rite, [ROOT.GetLeader] faltered over a name no human tongue was made to say. The curse took hold, but weakly. It will not last."
 eldritch.82.d.preach_pass:0 "[ROOT.GetEldritchCheckLine]\n\nBy the end of the speech the crowd was chanting with the Prophet, and then ahead of the Prophet. Recruiting offices report queues around the block."
 eldritch.82.d.preach_fail:0 "[ROOT.GetEldritchCheckLine]\n\nThe crowd listened politely and went home calmer. Nobody cheered."
 eldritch.82.d.incarnate_pass:0 "[ROOT.GetEldritchCheckLine]\n\n[ROOT.GetLeader] led the final chant alone, and [ROOT.GetEldritchGodName] came at once. The god is pleased to have been called by so devoted a voice, and some of our offering has been returned."
 eldritch.82.d.incarnate_fail:0 "[ROOT.GetEldritchCheckLine]\n\nThe god came, but slowly, and it did not seem pleased by the voice that called it."
 eldritch.82.d.vessel_pass:0 "[ROOT.GetEldritchCheckLine]\n\nThrough the whole of the change, [ROOT.GetLeader] held on to one memory: their own name. It is still there. The nation is frightened, but not as frightened as it might be."
 eldritch.82.d.vessel_fail:0 "[ROOT.GetEldritchCheckLine]\n\nSomewhere in the change, [ROOT.GetLeader] let go. The Vessel remembers being our leader the way one remembers a book. The nation has noticed."
 eldritch.82.a:0 "So it is written."

 eldritch_news.1.t:0 "Something Has Answered [From.GetNameDef]"
 eldritch_news.1.d.cthulhu:0 "Ships off the coast of [From.GetNameDef] report the sea boiling green, and coastal villages have been taken over by strange, fish-eyed people who walk out of the surf. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Cthulhu, the Dreamer in R'lyeh."
 eldritch_news.1.d.hastur:0 "A strange yellow symbol has appeared on the banners of [From.GetNameDef], and foreign journalists who look at it too long do not come home. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Hastur, the King in Yellow."
 eldritch_news.1.d.azathoth:0 "A crater has appeared in [From.GetNameDef] where a hill used to be, and radio operators around the world are picking up a thin, piping whine on every frequency. Intelligence services confirm the unthinkable: [From.GetNameDef] has made a pact with Azathoth, the Daemon Sultan."
 eldritch_news.1.a:0 "May it never turn its gaze toward us."
 eldritch_news.2.t:0 "An Old One Walks the Earth"
 eldritch_news.2.d:0 "Whatever [From.GetNameDef] has been doing in its temples, it is finished. [From.GetEldritchGodName] has fully crossed into our world and stands at the side of [From.GetNameDef]. Governments everywhere are holding emergency sessions, and churches are full."
 eldritch_news.2.a:0 "The stars are right, and we are not ready."
 eldritch_news.3.t:0 "A God Walks the Battlefield"
 eldritch_news.3.d.cthulhu:0 "Reconnaissance photographs from [From.GetNameDef] show a colossal winged figure with a head like an octopus, wading ashore at the head of an army. Military analysts are unable to estimate its strength. Several of them have resigned."
 eldritch_news.3.d.hastur:0 "Correspondents near [From.GetNameDef] report a giant figure in yellow rags marching at the head of its armies. Those who saw its face have not filed their stories."
 eldritch_news.3.d.azathoth:0 "The sky over [From.GetNameDef] has torn open, and something has come through. Instruments around the world are recording impossible readings. Whatever it is, it now marches with the army of [From.GetNameDef]."
 eldritch_news.3.a:0 "Gods help us. Not that one."
 eldritch_news.4.t:0 "The Leader of [From.GetNameDef] Is No Longer Human"
 eldritch_news.4.d:0 "Foreign diplomats in [From.GetNameDef] are refusing to attend audiences with [From.GetLeader]. Those who went describe a figure that looked like the leader they knew and spoke with the leader's voice, but was filled with something else. Intelligence services confirm the worst: [From.GetLeader] has been given over entirely to [From.GetEldritchGodName], and [From.GetNameDef] is now ruled by the god's living vessel."
 eldritch_news.4.a:0 "What have they done?"

 ################################################################
 # THE PROPHET'S QUESTS
 ################################################################

 eldritch_prophet_quests:0 "The Prophet's Quests"
 eldritch_prophet_quests_desc:0 "Some works are too great for a single rite. Every cult can undertake three quests: §RRecover the Necronomicon§! and §RAt the Mountains of Madness§!, which any pact may attempt, and its patron's own great work.\n\nA quest begins with a ritual. Then the Prophet chooses an approach, which decides the stat its finale will test, and has a limited time to carry out a task with the pact's rites. The finale is a skill check: success brings a §Rrelic§!, experience and Insight; failure has a price, and the quest can be begun again a year after that attempt began.\n\n§RQuests completed:§! §R[?eldritch_quests_done|0]§!"

 eldritch_cost_favor_100:0 "§R100§! Favor"
 eldritch_cost_favor_100_blocked:0 "§R100§! Favor"
 eldritch_cost_quest_necronomicon:0 "§R50§! Political Power and §R25§! Favor"
 eldritch_cost_quest_necronomicon_blocked:0 "§R50§! Political Power and §R25§! Favor"

 eldritch_quest_underway_tt:0 "This quest is not already underway"
 eldritch_quest_begin_tt:0 "The first stage of the quest ends, and the Prophet chooses how to go on."
 eldritch_quest_finale_tt:0 "The quest's finale: a §Rskill check§! decides whether it succeeds."
 eldritch_quest_timeout_tt:0 "§RThe quest fails.§! It can be begun again a year after this attempt began."
 eldritch_quest_tests_lore_tt:0 "The finale will test the Prophet's §RLore§! (+7% per point)."
 eldritch_quest_tests_zeal_tt:0 "The finale will test the Prophet's §RZeal§! (+7% per point)."
 eldritch_quest_tests_will_tt:0 "The finale will test the Prophet's §RWill§! (+7% per point)."
 eldritch_quest_bonus_tt:0 "This approach adds §G+20%§! to the finale's check."
 eldritch_prophet_insight_1_tt:0 "The Prophet gains §G1§! Insight."
 eldritch_quest_hastur_curse_all_tt:0 "Every nation at war with us suffers §RThe Yellow Madness§! for 90 days."

 eldritch_quest_necronomicon:0 "Quest: Recover the Necronomicon"
 eldritch_quest_necronomicon_desc:0 "Every cult has fragments. [ROOT.GetNameDef] deserves the whole book: the Necronomicon of the mad Arab Abdul Alhazred, in Olaus Wormius's Latin, complete. Rumour says a copy has surfaced in a private collection in Buenos Aires.\n\n§RA 30-day search, then choose how to take the book. Reward: the relic The Necronomicon (research speed and political power), experience and Insight.§!"
 eldritch_quest_necronomicon_task:0 "Translate the Necronomicon"
 eldritch_quest_necronomicon_task_desc:0 "The book is ours. Now the translators must survive it, and they will only last as long as the rites protect them."
 eldritch_quest_necronomicon_task_tt:0 "Hold a §RRite of Worship§! and §RCommune with [ROOT.GetEldritchGodName]§! while the translators work (120 days)"
 eldritch.201.t:0 "A Copy Surfaces"
 eldritch.201.d:0 "Our agents have found it: a complete copy, bound in something that is not quite leather, in the private library of a wealthy collector who has never opened it. He will not sell to just anyone. He will not sell at all, if he learns who is asking."
 eldritch.201.a:0 "Pay his price, and keep the translators' minds steady through the reading."
 eldritch.201.b:0 "Send men to take it."
 eldritch.201.c:0 "§R(Lore 3)§! There is an older copy in his cellar. He does not know it is there."
 eldritch.202.t:0 "The Necronomicon"
 eldritch.202.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe translation is finished. Three translators are in the asylum and one is in the river, but the book is ours, every page of it, and the cult's rites will never be the same."
 eldritch.202.a:0 "That is not dead which can eternal lie."
 eldritch.203.t:0 "The Book Burns"
 eldritch.203.d:0 "[ROOT.GetEldritchCheckLine]\n\nOn the last night of the translation, the chief translator locked himself in the vault with the book and a can of petrol. He left a note: 'It was reading me.' [ROOT.GetEldritchGodName] seems oddly pleased."
 eldritch.203.a:0 "Find us another copy."
 eldritch_relic_necronomicon:0 "The Necronomicon"
 eldritch_relic_necronomicon_desc:0 "Abdul Alhazred's book, whole and translated, kept in the sanctum. Nobody reads it twice."

 eldritch_quest_mountains:0 "Quest: At the Mountains of Madness"
 eldritch_quest_mountains_desc:0 "The Miskatonic expedition of 1931 came back from Antarctica with half its members and none of its photographs. The survivors would not say what they found beyond the mountains. [ROOT.GetLeader] intends to find out.\n\n§RNeeds Tier II. A 45-day expedition, then choose how to explore. Reward: the relic The Elder Things' Archive (research speed and factory output), experience and Insight.§!"
 eldritch_quest_mountains_task:0 "The City Beyond the Mountains"
 eldritch_quest_mountains_task_desc:0 "The expedition has found the city of the Elder Things. Whatever lives there now must not follow them home, and the nation must be steady enough to hear what they bring back."
 eldritch_quest_mountains_task_tt:0 "§RConvene the Dark Council§! to plan the descent, and §RPreach to the Faithful§! before the news breaks (150 days)"
 eldritch.271.t:0 "Beyond the Mountains"
 eldritch.271.d:0 "The expedition's radio message was short: they have crossed the range, and the city is there, vast and empty and built for things that were not human. Something has been following their tracks through the snow. They ask for orders."
 eldritch.271.a:0 "Push into the city with every man we have."
 eldritch.271.b:0 "Go slowly, and keep the men from looking too long."
 eldritch.271.c:0 "§R(Lore 4)§! Read the carvings: the Elder Things left a map."
 eldritch.272.t:0 "The Elder Things' Archive"
 eldritch.272.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe expedition came home with crates of carvings and the notes of a race that ruled the Earth before the dinosaurs. Our engineers have already begun to copy their methods. Nobody asks what happened to the thing that followed them."
 eldritch.272.a:0 "Their science is ours now."
 eldritch.273.t:0 "Tekeli-li"
 eldritch.273.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe last radio message was a single word, repeated, in a piping voice that did not belong to any member of the expedition. No search party has found a trace of them."
 eldritch.273.a:0 "Seal the files."
 eldritch_relic_elder_archive:0 "The Elder Things' Archive"
 eldritch_relic_elder_archive_desc:0 "Carvings and star-maps from a city older than mankind. Our engineers study them by day and dream of them by night."

 eldritch_quest_cthulhu:0 "Quest: Raise R'lyeh"
 eldritch_quest_cthulhu_desc:0 "Far out in the South Pacific, the corpse-city of R'lyeh lies beneath the waves, and in it great Cthulhu waits dreaming. The stars are nearly right. With enough faith, [ROOT.GetNameDef] can bring the city up a little sooner.\n\n§RNeeds Tier II. A 60-day ritual at sea, then choose how to raise it. Reward: the relic R'lyeh Risen (naval power and invasions), two more servitor divisions, experience and Insight.§!"
 eldritch_quest_cthulhu_task:0 "The Rising"
 eldritch_quest_cthulhu_task_desc:0 "The city is rising. The Deep Ones must hold the sea around it until it breaks the surface."
 eldritch_quest_cthulhu_task_tt:0 "§RCall Forth the Servitors§!, then have §RGreat Cthulhu§! walking the earth or at least 12 §RDeep One Brood§! battalions in the field (180 days)"
 eldritch.211.t:0 "The Soundings"
 eldritch.211.d:0 "Our ships' soundings have found it: a mountain of green stone, still rising, with angles the instruments cannot measure. Foreign navies have noticed the earthquakes. They are sending ships to look."
 eldritch.211.a:0 "Sink every ship that comes near."
 eldritch.211.b:0 "Let the Deep Ones guide our divers down."
 eldritch.211.c:0 "§R(Lore 4)§! Chart the city's impossible angles, and raise it the right way up."
 eldritch.212.t:0 "R'lyeh Rises"
 eldritch.212.d:0 "[ROOT.GetEldritchCheckLine]\n\nAt dawn the sea split, and a coast of slimy green stone rose into the sunlight. The tower doors stand open, and the Deep Ones pour out of them in their thousands to join our fleets. Sailors of every nation now pray when they cross those waters."
 eldritch.212.a:0 "Ph'nglui mglw'nafh Cthulhu R'lyeh wgah'nagl fhtagn!"
 eldritch.213.t:0 "The Sea Closes"
 eldritch.213.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe city reached the surface for a single night, then sank again with all our divers aboard. The tidal wave struck our coast before dawn. Somewhere below, the dreamer turned over in his sleep."
 eldritch.213.a:0 "The stars were not right."
 eldritch_relic_rlyeh:0 "R'lyeh Risen"
 eldritch_relic_rlyeh_desc:0 "The sunken city stands above the waves, and its servants sail with our fleets."

 eldritch_quest_hastur:0 "Quest: Stage the Full Play"
 eldritch_quest_hastur_desc:0 "The King in Yellow has never been performed in full. The second act ends every production early: the actors go mad, the theatre burns, and the audience goes home and does not stop screaming. [ROOT.GetLeader] will see it finished.\n\n§RNeeds a war. A 30-day rehearsal, then choose the cast. Reward: the relic The Full Play Performed (morale, organization and war support), the Yellow Madness on every enemy, the Audience battalion and a first division of it, experience and Insight.§!"
 eldritch_quest_hastur_task:0 "The Second Act"
 eldritch_quest_hastur_task_desc:0 "The play is ready. Stage it for the enemy first, and keep the nation's spirit high enough to watch it to the end."
 eldritch_quest_hastur_task_tt:0 "§RStage 'The King in Yellow'§! in an enemy nation, and have war support above §R50%§! (150 days)"
 eldritch.231.t:0 "Casting the King"
 eldritch.231.d:0 "The director has the script, all of it, including the pages no one has read since 1895. Now he needs a cast that can survive the second act, or at least survive it long enough."
 eldritch.231.a:0 "Cast fanatics. They will not stop for anything."
 eldritch.231.b:0 "Cast actors who will come out of it sane."
 eldritch.231.c:0 "§R(Lore 4)§! Restore the lost lines that make the play complete."
 eldritch.232.t:0 "The Final Curtain"
 eldritch.232.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe curtain fell on the last line of the second act, and the King in Yellow stood on the stage and took off his mask. The audience rose as one. Tonight the play opens in the enemy's theatres, whether they like it or not."
 eldritch.232.a:0 "Have you seen the Yellow Sign?"
 eldritch.233.t:0 "The Audience Goes Mad"
 eldritch.233.d:0 "[ROOT.GetEldritchCheckLine]\n\nHalfway through the second act the actors stopped acting. The audience did not go home. It went into the streets, and it is still there, singing about Carcosa."
 eldritch.233.a:0 "Close every theatre."
 eldritch_relic_full_play:0 "The Full Play Performed"
 eldritch_relic_full_play_desc:0 "Our soldiers have seen the whole play. Nothing on any battlefield can frighten them now."

 eldritch_quest_azathoth:0 "Quest: The Daemon Sultan's Engine"
 eldritch_quest_azathoth_desc:0 "A bottled fragment of the nuclear chaos destroys a city. A fragment harnessed could power a nation. [ROOT.GetLeader] has commissioned an engine with Azathoth at its heart.\n\n§RNeeds Tier II. A 60-day construction, then choose how to tame it. Reward: the relic The Daemon Engine (factory output and efficiency, at a cost in stability), two nuclear bombs, experience and Insight.§!"
 eldritch_quest_azathoth_task:0 "Feeding the Engine"
 eldritch_quest_azathoth_task_desc:0 "The engine is built. It needs one more fragment of the chaos to wake."
 eldritch_quest_azathoth_task_tt:0 "§RBottle the Nuclear Chaos§! (180 days)"
 eldritch.261.t:0 "Building the Engine"
 eldritch.261.d:0 "The engine fills an entire valley: lead walls a metre thick, cooling towers, and a chamber at its heart that no one may enter. The piping from the chamber has already begun. The engineers ask how it should be controlled."
 eldritch.261.a:0 "Shield it in lead and mathematics."
 eldritch.261.b:0 "Let the pipers lull it."
 eldritch.261.c:0 "§R(Zeal 4)§! Feed it, and keep feeding it."
 eldritch.262.t:0 "The Engine Wakes"
 eldritch.262.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe engine woke at midnight, and every factory in the nation woke with it. Production has doubled in the valley towns. So has the number of people who cannot stop humming the piping."
 eldritch.262.a:0 "Feed it more."
 eldritch.263.t:0 "The Engine Breaks"
 eldritch.263.d:0 "[ROOT.GetEldritchCheckLine]\n\nThe engine woke, and then it kept waking. When it was over there was a crater where the valley had been, and the piping could be heard three hundred miles away."
 eldritch.263.a:0 "Build the next one further away."
 eldritch_relic_engine:0 "The Daemon Engine"
 eldritch_relic_engine_desc:0 "A fragment of the nuclear chaos hums at the heart of our industry. The workers near it do not sleep, and do not need to."

 eldritch.290.t:0 "The Moment Passes"
 eldritch.290.d:0 "The time we had for the work has run out. The signs have faded, the trail has gone cold and the faithful are tired. The quest must wait for another chance."
 eldritch.290.a:0 "We will try again."

 ################################################################
 # THE ROAD TO CARCOSA - Hastur's questline and formable
 ################################################################

 eldritch_road_to_carcosa:0 "The Road to Carcosa"
 eldritch_road_to_carcosa_desc:0 "§RAlong the shore the cloud waves break,\nThe twin suns sink behind the lake,\nThe shadows lengthen\nIn Carcosa.§!\n\n[ROOT.GetLeader] has heard Cassilda's song, and cannot stop hearing it. Six steps lead from [ROOT.GetNameDef] to the lost city on the shore of Lake Hali, where the King in Yellow keeps a throne for whoever reaches it.\n\nEach chapter is a set of goals to achieve: lands to conquer, the cult's own buildings to raise, and the pact to deepen. When they are met, complete the chapter to claim its rewards and open the next. At the end of the road, [ROOT.GetNameDef] becomes §RCarcosa§!.\n\n§RChapters completed:§! §R[?eldritch_carcosa_chapter|0]§! of 6"
 eldritch_carcosa_ready_tt:0 "§RProclaim Carcosa§! becomes available."
 eldritch_carcosa_goal_theatre_capital_tt:0 "£eldritch_building_yellow_theatre_text£ A §RTheatre of the Yellow Sign§! stands in our capital"
 eldritch_carcosa_goal_theatres_tt:0 "£eldritch_building_yellow_theatre_text£ §RTheatres of the Yellow Sign§! stand in at least §R3§! of our states"
 eldritch_carcosa_goal_zealots_tt:0 "At least §R9§! battalions of §RZealots of the Yellow Sign§! in the field"
 eldritch_carcosa_goal_states_3_tt:0 "We control at least §R[?eldritch_carcosa_3_states|0]§! states (5 more than when this chapter opened)"
 eldritch_carcosa_goal_masque_tt:0 "£eldritch_building_masque_hall_text£ The §RHall of the Pallid Masque§! stands in one of our states"
 eldritch_carcosa_goal_observatories_tt:0 "£eldritch_building_black_star_observatory_text£ §RBlack Star Observatories§! stand in at least §R2§! of our states"
 eldritch_carcosa_goal_states_5_tt:0 "We control at least §R[?eldritch_carcosa_5_states|0]§! states (10 more than when this chapter opened)"
 eldritch_carcosa_goal_capital_tt:0 "We control a state that was another nation's §Rcapital§! when the game began"
 eldritch_carcosa_goal_palace_tt:0 "£eldritch_building_yellow_palace_text£ The §RPalace of the Yellow King§! stands in our capital"
 eldritch_carcosa_goal_capitulated_tt:0 "A nation at war with us has §Rcapitulated§!"
 eldritch_carcosa_goal_prophet_tt:0 "[ROOT.GetLeader] is Hastur's §RVessel§! or §RChosen§!"
 eldritch_carcosa_opens_2_tt:0 "Opens §RChapter II: Cassilda's Song§!."
 eldritch_carcosa_opens_3_tt:0 "Opens §RChapter III: The Stranger in the Pallid Mask§!, and the §RHall of the Pallid Masque§! can be built."
 eldritch_carcosa_opens_4_tt:0 "Opens §RChapter IV: Black Stars Rise§!, and §RBlack Star Observatories§! can be built."
 eldritch_carcosa_opens_5_tt:0 "Opens §RChapter V: The King Walks§!."
 eldritch_carcosa_opens_6_tt:0 "Opens §RChapter VI: The Throne of Carcosa§!, and the §RPalace of the Yellow King§! can be built."
 eldritch_yellow_theatre:0 "Theatre of the Yellow Sign"
 eldritch_yellow_theatre_desc:0 "£eldritch_building_yellow_theatre_text£ A playhouse where 'The King in Yellow' is performed every night, all of it. The audience comes out singing.\n\nBuilt for the Road to Carcosa. +10% manpower in its state, +1% war support."
 eldritch_carcosa_theatre:0 "Theatre of the Yellow Sign"
 eldritch_carcosa_theatre_desc:0 "Unlocked on the Road to Carcosa."
 eldritch_masque_hall:0 "Hall of the Pallid Masque"
 eldritch_masque_hall_desc:0 "£eldritch_building_masque_hall_text£ A ballroom where the court of Carcosa unmasks at midnight. Some of the guests cannot.\n\nBuilt for the Road to Carcosa. +10% command power gain."
 eldritch_carcosa_masque_hall:0 "Hall of the Pallid Masque"
 eldritch_carcosa_masque_hall_desc:0 "Unlocked on the Road to Carcosa."
 eldritch_black_star_observatory:0 "Black Star Observatory"
 eldritch_black_star_observatory_desc:0 "£eldritch_building_black_star_observatory_text£ Its telescopes are pointed at stars that are not there. The astronomers write down what they see, and then they write it down again.\n\nBuilt for the Road to Carcosa. +2% research speed, -10% air night penalty."
 eldritch_carcosa_observatory:0 "Black Star Observatory"
 eldritch_carcosa_observatory_desc:0 "Unlocked on the Road to Carcosa."
 eldritch_yellow_palace:0 "Palace of the Yellow King"
 eldritch_yellow_palace_desc:0 "£eldritch_building_yellow_palace_text£ A palace built to the plans in the second act. Its towers are taller inside than out, and its throne room faces a lake that is not there.\n\nBuilt for the Road to Carcosa. +10% political power, +3% stability."
 eldritch_carcosa_palace:0 "Palace of the Yellow King"
 eldritch_carcosa_palace_desc:0 "Unlocked on the Road to Carcosa."
 eldritch_unlock_lidless_tt:0 "Unlocks the §RLidless§! battalion in the division designer, and a division of them, §RThe Lidless Watch§!, takes up its post near our capital."
 eldritch_unlock_audience_tt:0 "Unlocks the §RAudience§! battalion in the division designer, and the first of them, §RThe Second Act§!, file out of the theatre near our capital."
 eldritch_unlock_cassildas_choir_tt:0 "Unlocks §RCassilda's Choir§! (artillery) in the division designer, and a division led by the choir begins to sing near our capital."
 eldritch_unlock_pallid_masks_tt:0 "Unlocks the §RPallid Masks§! battalion in the division designer, and a division of them, §RThe Masque§!, arrives at midnight near our capital."
 eldritch_unlock_kings_tatters_tt:0 "Unlocks the §RKing's Tatters§! battalion in the division designer, and the rags torn loose in the capital gather into a division, §RThe Tatters of the King§!."
 eldritch_unlock_halis_drowned_tt:0 "Unlocks the §RHali's Drowned§! battalion in the division designer, and the first of them walk out of the river near our capital."

 eldritch_carcosa_1:0 "Chapter I: Have You Seen the Yellow Sign?"
 eldritch_carcosa_1_desc:0 "It begins with a symbol: a twisted, three-armed sign in yellow that no one remembers learning but everyone recognises. Once a nation has seen it, it cannot stop seeing it. [ROOT.GetLeader] means to make sure every citizen of [ROOT.GetNameDef] has seen it.\n\nGoals: a §RTheatre of the Yellow Sign§! in our capital (unlocked now, in the construction menu), and at least 40% war support.\n\n§RReward: The Road to Carcosa begins (war support and morale), the Lidless battalion and a first division of it, experience and Insight. Opens Chapter II.§!"
 eldritch.312.t:0 "The Sign Is Everywhere"
 eldritch.312.d:0 "Nobody painted the last thousand Signs. They simply appeared: on doorways, on schoolbooks, on the inside of eyelids. Soldiers trace it in the mud before they attack. The road to Carcosa has begun."
 eldritch.312.a:0 "Have you seen the Yellow Sign?"
 eldritch_carcosa_road_1:0 "The Road to Carcosa I: The Yellow Sign"
 eldritch_carcosa_road_1_desc:0 "The Yellow Sign is on every wall in the nation, and on more than a few faces."

 eldritch_carcosa_2:0 "Chapter II: Cassilda's Song"
 eldritch_carcosa_2_desc:0 "The first act of the play opens with a song: Cassilda's song, sung on the shore of Lake Hali. Only fragments survive. [ROOT.GetLeader] wants all of it, because whoever sings it in full will hear the answer.\n\nGoals: §RTheatres of the Yellow Sign§! in at least 3 of our states, and at least 9 battalions of Zealots of the Yellow Sign in the field.\n\n§RReward: The Road to Carcosa II (adds research speed), 30 Favor, Cassilda's Choir (artillery) and a first division with it, experience and Insight. Opens Chapter III.§!"
 eldritch.322.t:0 "Songs That the Hyades Shall Sing"
 eldritch.322.d:0 "The song was sung in full for the first time in two thousand years, in the cathedral of our capital. When it ended, something on the other side of the sky sang the next verse. Our scholars are writing it down as fast as they can."
 eldritch.322.a:0 "Where flap the tatters of the King..."
 eldritch_carcosa_road_2:0 "The Road to Carcosa II: Cassilda's Song"
 eldritch_carcosa_road_2_desc:0 "Cassilda's song is sung in every church and barracks. Nobody can remember learning it."

 eldritch_carcosa_3:0 "Chapter III: The Stranger in the Pallid Mask"
 eldritch_carcosa_3_desc:0 "In the play, a Stranger arrives at the court of Carcosa wearing a pale mask, and everyone is ordered to unmask at midnight. The Stranger does not. [ROOT.GetLeader] must receive him, and give him a seat at the council.\n\nGoals: a Stirring pact (Tier II); conquer §R5§! more states than we controlled when this chapter opened; and build the §RHall of the Pallid Masque§! (unlocked now).\n\n§RReward: The Road to Carcosa III (adds organization), 50 command power, the Pallid Masks battalion and a first division of it, experience and Insight. Opens Chapter IV.§!"
 eldritch.332.t:0 "I Wear No Mask"
 eldritch.332.d:0 "At the council's first midnight, the ministers took off their masks as the old play demands. The Stranger did not. 'I wear no mask,' he said, and the generals understood that they had been given an ally beyond any army in the world."
 eldritch.332.a:0 "'Tis time. We all have laid aside disguise but you."
 eldritch_carcosa_road_3:0 "The Road to Carcosa III: The Pallid Mask"
 eldritch_carcosa_road_3_desc:0 "The Stranger in the Pallid Mask sits at our council. He never speaks, and he is never wrong."

 eldritch_carcosa_4:0 "Chapter IV: Black Stars Rise"
 eldritch_carcosa_4_desc:0 "Strange is the night where black stars rise, and strange moons circle through the skies. Before the King can come, the sky over [ROOT.GetNameDef] must become the sky over Carcosa, and only an Ascendant pact can bring the black stars.\n\nGoals: an Ascendant pact (Tier III), and §RBlack Star Observatories§! in at least 2 of our states (unlocked now).\n\n§RReward: The Road to Carcosa IV (adds political power), war support, experience and Insight. Opens Chapter V.§!"
 eldritch.342.t:0 "Strange Is the Night"
 eldritch.342.d:0 "The night sky over [ROOT.GetNameDef] is no longer the sky the rest of the world sees. There are black stars in it, and strange moons, and on clear nights the twin suns of Carcosa can be seen setting into a lake that is not there."
 eldritch.342.a:0 "Strange is the night where black stars rise."
 eldritch_carcosa_road_4:0 "The Road to Carcosa IV: Black Stars"
 eldritch_carcosa_road_4_desc:0 "Black stars rise over the capital every night. The people have stopped looking up, but they can feel them there."

 eldritch_carcosa_5:0 "Chapter V: The King Walks"
 eldritch_carcosa_5_desc:0 "Now the King himself must come, in tattered robes of yellow, and walk in triumph through a city that has fallen to [ROOT.GetNameDef]. He will not stay to fight, not until Carcosa is proclaimed, but he will walk once, behind his Host, through the streets of a conquered capital.\n\nGoals: conquer §R10§! more states than we controlled when this chapter opened, and hold a state that was another nation's capital when the game began (a nation moves its capital when it falls, so it is the old capital that counts).\n\n§RReward: The Road to Carcosa V (adds stability), 50 army experience, the King's Tatters battalion and a first division of it, experience and Insight. Opens Chapter VI.§!"
 eldritch.352.t:0 "The King in Yellow"
 eldritch.352.d:0 "[ROOT.GetLeader] walked beside the King from the edge of the capital to the palace steps. The crowds did not cheer. They knelt, and those who looked under the King's hood are still kneeling. Then he was gone, as if he had never been there. The priests say he will not walk among us again until Carcosa is proclaimed."
 eldritch.352.a:0 "Hail the King in Yellow!"
 eldritch_carcosa_road_5:0 "The Road to Carcosa V: The King Walks"
 eldritch_carcosa_road_5_desc:0 "The King in Yellow has walked our streets. The road to Carcosa is almost at its end."

 eldritch_carcosa_6:0 "Chapter VI: The Throne of Carcosa"
 eldritch_carcosa_6_desc:0 "Lost Carcosa waits on the far shore of Lake Hali, and its throne is empty. The King does not sit on it; he only offers it, to a nation that has built him a palace and broken an enemy, and whose Prophet is more than human: the King's own Vessel, or his Chosen.\n\nGoals: the §RPalace of the Yellow King§! in our capital (unlocked now); an enemy that has capitulated to us; and a Prophet who is Hastur's Vessel or Chosen.\n\n§RReward: the right to proclaim Carcosa, the Hali's Drowned battalion and a first division of it, experience and Insight.§!"
 eldritch.362.t:0 "The Empty Throne"
 eldritch.362.d:0 "[ROOT.GetLeader] crossed Lake Hali and climbed the stairs of the highest tower in Carcosa, and the throne was there, empty and waiting. The Prophet did not sit. Not yet. The throne will be there when [ROOT.GetNameDef] is ready to proclaim it."
 eldritch.362.a:0 "Carcosa awaits."

 eldritch_proclaim_carcosa:0 "Proclaim Carcosa"
 eldritch_proclaim_carcosa_desc:0 "The road is walked, the lake is crossed, and the throne is waiting. [ROOT.GetLeader] will lay aside the old name of [ROOT.GetNameDef] and proclaim what it has truly become: Carcosa, where the twin suns set and the King in Yellow reigns.\n\n§RThe nation becomes Carcosa, with a new name and flag, and The Road to Carcosa becomes The Yellow Throne. The King in Yellow can at last be incarnated, twice as mighty as any other god. The whole world will hear of it.§!"
 eldritch_proclaim_carcosa_tt:0 "Our nation becomes §RCarcosa§!, with a new name and the flag of the King in Yellow. §RThe King in Yellow§! himself can now be incarnated."
 eldritch_yellow_throne:0 "The Yellow Throne"
 eldritch_yellow_throne_desc:0 "Carcosa has risen in our land, and the King in Yellow reigns through our Prophet. Strange is the night, and stranger still the nation that marches under it."
 eldritch.370.t:0 "Carcosa"
 eldritch.370.d:0 "§RAlong the shore the cloud waves break,\nThe twin suns sink behind the lake,\nThe shadows lengthen\nIn Carcosa.§!\n\nThe old flag came down at dusk and the new one went up: the King in Yellow on black, between two bands of gold. [ROOT.GetLeader] took the throne of Carcosa before the whole nation, and somewhere beyond the sky, the King in Yellow smiled under his mask."
 eldritch.370.a:0 "Long live the Yellow Throne!"
 eldritch_news.5.t:0 "A Nation Becomes Carcosa"
 eldritch_news.5.d:0 "Diplomats are being recalled from the capital of the nation that now calls itself [From.GetNameDef]. Its new flag bears the Yellow Sign, its night sky is full of black stars, and its ruler, [From.GetLeader], is said to sit on a throne from a play that was banned in every country that ever staged it. Theatres around the world are cancelling their seasons."
 eldritch_news.5.a:0 "Do not look at the flag."

