 RULE_GROUP_ELDRITCH:0 "Eldritch Pacts"
 RULE_ELDRITCH_AI_PACTS:0 "AI Eldritch Pacts"
 RULE_ELDRITCH_AI_PACTS_DISABLED:0 "Disabled"
 RULE_ELDRITCH_AI_PACTS_DISABLED_DESC:0 "AI nations never seek the forbidden lore. Only human players can summon the Old Ones."
 RULE_ELDRITCH_AI_PACTS_ALLOWED:0 "Allowed"
 RULE_ELDRITCH_AI_PACTS_ALLOWED_DESC:0 "AI nations may seek the forbidden lore, bind themselves to an Old One, and use its blessings."

