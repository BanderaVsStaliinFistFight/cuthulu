 eldritch_lore_found_tt:0 "The §Ysummoning rituals§! of the Old Ones are revealed."
 eldritch_summonings_unlocked_tt:0 "Six summoning rituals are now available in §YThe Forbidden Rites§!.\n§RChoose carefully: only one god can ever be bound to us.§!"
 eldritch_pact_sealed_tt:0 "The pact is sealed. §YBlessings§! become available in §YThe Forbidden Rites§!, and every other nation will learn what we have done."
 eldritch_start_favor_tt:0 "Start with §G50§! Eldritch Favor and gain §G5§! more each month."
 eldritch_units_empowered_tt:0 "Our §Yeldritch battalions§! grow stronger, with better attack, defense, breakthrough and organization."
 eldritch_monthly_favor_tier_2_tt:0 "Monthly Eldritch Favor rises to §G8§!."
 eldritch_monthly_favor_tier_3_tt:0 "Monthly Eldritch Favor rises to §G12§!."

 eldritch_units_cthulhu_tt:0 "Unlocks the §YDeep One Brood§! and §YStar-Spawn of Cthulhu§! battalions and the locked §YDeep One Swarm§! division template."
 eldritch_units_nyarlathotep_tt:0 "Unlocks the §YFaceless Cultists§! and §YShantak Riders§! battalions and the locked §YFaceless Legion§! division template."
 eldritch_units_hastur_tt:0 "Unlocks the §YZealots of the Yellow Sign§! and §YByakhee Riders§! battalions and the locked §YHost of the Yellow Sign§! division template."
 eldritch_units_shub_niggurath_tt:0 "Unlocks the §YDark Young§! and §YThousand Young§! battalions and the locked §YBrood of the Black Goat§! division template."
