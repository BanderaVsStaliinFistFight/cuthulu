 # DOCTRINES
 ################################################################

 eldritch_doctrine_folder:0 "Eldritch"
 eldritch_track_servitors:0 "The Servitors"
 eldritch_track_faithful:0 "The Faithful"
 eldritch_track_rites:0 "Rites of War"
 eldritch_rising_tide:0 "The Rising Tide"
 eldritch_rising_tide_desc:0 "In his house at R'lyeh dead Cthulhu waits dreaming, and the sea gives up his armies. Every coast is a front line, and every river is a road."
 eldritch_yellow_sign:0 "The Yellow Sign"
 eldritch_yellow_sign_desc:0 "Once seen, the Sign cannot be unseen. Soldiers who carry it do not break, do not rest, and do not stop until the last line of the play has been spoken."
 eldritch_nuclear_chaos:0 "The Nuclear Chaos"
 eldritch_nuclear_chaos_desc:0 "At the centre of everything the blind idiot god bubbles and blasphemes, while its pipers play the tune that keeps it asleep. Its armies are chaos made flesh: terrible in the attack, careless of everything else."
 eldritch_brood_of_dagon:0 "The Brood of Dagon"
 eldritch_brood_of_dagon_desc:0 "Dagon's children, born in the black water off Devil Reef. They do not age, and they do not stay dead unless they are killed properly."
 eldritch_brood_of_dagon_gills:0 "Gills and Webbed Hands"
 eldritch_brood_of_dagon_gills_desc:0 "Rivers and marshes are home."
 eldritch_brood_of_dagon_star_children:0 "Children of the Stars"
 eldritch_brood_of_dagon_star_children_desc:0 "The Star-Spawn remember how they took this world the first time."
 eldritch_brood_of_dagon_the_spawning:0 "The Spawning"
 eldritch_brood_of_dagon_the_spawning_desc:0 "Every tide brings more of them out of the water."
 eldritch_brood_of_dagon_immortal:0 "Immortal Unless Killed"
 eldritch_brood_of_dagon_immortal_desc:0 "Wounds that would kill a man close in an hour."
 eldritch_esoteric_order:0 "The Esoteric Order of Dagon"
 eldritch_esoteric_order_desc:0 "In the old harbour towns the fishermen joined the Order generations ago. Their sons have the Innsmouth look, and they swim better than they walk."
 eldritch_esoteric_order_innsmouth_look:0 "The Innsmouth Look"
 eldritch_esoteric_order_innsmouth_look_desc:0 "Bulging eyes that never blink, and skin that does not feel the cold."
 eldritch_esoteric_order_reef_tithes:0 "Tithes from the Reef"
 eldritch_esoteric_order_reef_tithes_desc:0 "The Order's boats know every landing beach on the coast."
 eldritch_esoteric_order_marsh_walkers:0 "Marsh Walkers"
 eldritch_esoteric_order_marsh_walkers_desc:0 "Mud and water slow them less than they slow anyone else."
 eldritch_esoteric_order_oath_of_dagon:0 "The Oath of Dagon"
 eldritch_esoteric_order_oath_of_dagon_desc:0 "The third oath binds them to the Order for ever. They do not break it."
 eldritch_dreams_of_the_sleeper:0 "Dreams of the Sleeper"
 eldritch_dreams_of_the_sleeper_desc:0 "Artists, madmen and generals share the same dream: a city of wrong angles under green water, and a voice that tells them where the enemy is weakest."
 eldritch_dreams_of_the_sleeper_call_in_dreams:0 "The Call in Dreams"
 eldritch_dreams_of_the_sleeper_call_in_dreams_desc:0 "The staff officers wake with the plan already in their heads."
 eldritch_dreams_of_the_sleeper_wrong_angles:0 "Non-Euclidean Lines"
 eldritch_dreams_of_the_sleeper_wrong_angles_desc:0 "Our trenches follow angles the enemy's mapmakers cannot draw."
 eldritch_dreams_of_the_sleeper_storm_over_the_sea:0 "Storm over the Sea"
 eldritch_dreams_of_the_sleeper_storm_over_the_sea_desc:0 "The storms rise when our ships sail, and calm when they land."
 eldritch_dreams_of_the_sleeper_stars_are_right:0 "When the Stars Are Right"
 eldritch_dreams_of_the_sleeper_stars_are_right_desc:0 "Then nothing will hold them back."
 eldritch_host_of_carcosa:0 "The Host of Carcosa"
 eldritch_host_of_carcosa_desc:0 "Zealots, riders, and the things the Road to Carcosa has given us."
 eldritch_host_of_carcosa_robes_of_ochre:0 "Robes of Ochre"
 eldritch_host_of_carcosa_robes_of_ochre_desc:0 "They hold the line in silence, and the line holds."
 eldritch_host_of_carcosa_byakhee_wings:0 "Wings of the Byakhee"
 eldritch_host_of_carcosa_byakhee_wings_desc:0 "They come down out of the clouds with the rain."
 eldritch_host_of_carcosa_pallid_court:0 "The Pallid Court"
 eldritch_host_of_carcosa_pallid_court_desc:0 "The Masks and the Tatters lead every assault."
 eldritch_host_of_carcosa_read_the_play:0 "Those Who Have Read the Play"
 eldritch_host_of_carcosa_read_the_play_desc:0 "Nothing on a battlefield frightens them any more."
 eldritch_second_act:0 "The Second Act"
 eldritch_second_act_desc:0 "Every soldier is given the play to read before the battle. Few of them reach the second act. Those who do are no longer afraid of anything."
 eldritch_second_act_yellow_sign_seen:0 "Have You Seen the Yellow Sign?"
 eldritch_second_act_yellow_sign_seen_desc:0 "It is painted on every helmet."
 eldritch_second_act_masque:0 "The Masque at Midnight"
 eldritch_second_act_masque_desc:0 "At midnight they unmask. Some of them cannot."
 eldritch_second_act_cassildas_song:0 "Cassilda's Song"
 eldritch_second_act_cassildas_song_desc:0 "The whole nation sings it, and it does not want to stop."
 eldritch_second_act_no_one_leaves:0 "No One Leaves the Theatre"
 eldritch_second_act_no_one_leaves_desc:0 "Even broken, they keep their places."
 eldritch_winds_of_hali:0 "The Winds of Hali"
 eldritch_winds_of_hali_desc:0 "Hastur is the Unspeakable One, Him Who Walks the Winds. The air over his armies belongs to him."
 eldritch_winds_of_hali_walks_the_winds:0 "Him Who Walks the Winds"
 eldritch_winds_of_hali_walks_the_winds_desc:0 "Our aircraft fly with the wind behind them, always."
 eldritch_winds_of_hali_black_stars:0 "Black Stars Rise"
 eldritch_winds_of_hali_black_stars_desc:0 "Our pilots see by the light of the black stars."
 eldritch_winds_of_hali_tattered_sky:0 "The Tattered Sky"
 eldritch_winds_of_hali_tattered_sky_desc:0 "Enemy aircraft come back with their crews raving, if they come back."
 eldritch_winds_of_hali_where_flap_the_tatters:0 "Where Flap the Tatters of the King"
 eldritch_winds_of_hali_where_flap_the_tatters_desc:0 "The banners above our columns move when there is no wind."
 eldritch_court_of_the_daemon_sultan:0 "The Court of the Daemon Sultan"
 eldritch_court_of_the_daemon_sultan_desc:0 "The shapeless dancers and the flute-players of the Court, sent out from the centre of chaos to unmake whatever stands in front of them."
 eldritch_court_of_the_daemon_sultan_matter_unmade:0 "Matter Unmade"
 eldritch_court_of_the_daemon_sultan_matter_unmade_desc:0 "Armour plate comes apart in their hands like wet paper."
 eldritch_court_of_the_daemon_sultan_monotonous_piping:0 "The Monotonous Piping"
 eldritch_court_of_the_daemon_sultan_monotonous_piping_desc:0 "The tune gets inside the enemy's skull and stays there."
 eldritch_court_of_the_daemon_sultan_mindless_dance:0 "The Mindless Dance"
 eldritch_court_of_the_daemon_sultan_mindless_dance_desc:0 "They whirl and do not tire."
 eldritch_court_of_the_daemon_sultan_boiling_chaos:0 "Boiling Chaos"
 eldritch_court_of_the_daemon_sultan_boiling_chaos_desc:0 "There is nothing in them left to frighten."
 eldritch_mindless_dancers:0 "The Mindless Dancers"
 eldritch_mindless_dancers_desc:0 "Its worshippers dance until they forget their names. Then they make excellent shock troops."
 eldritch_mindless_dancers_frenzy:0 "Frenzy"
 eldritch_mindless_dancers_frenzy_desc:0 "They attack with whatever they have, including their teeth."
 eldritch_mindless_dancers_heedless:0 "Heedless"
 eldritch_mindless_dancers_heedless_desc:0 "They do not notice that they are losing."
 eldritch_mindless_dancers_forgotten_fear:0 "They Forget Fear"
 eldritch_mindless_dancers_forgotten_fear_desc:0 "Along with their names, their homes and their mothers."
 eldritch_mindless_dancers_unthinking:0 "Unthinking"
 eldritch_mindless_dancers_unthinking_desc:0 "No thought, no hesitation, no flank they will not charge."
 eldritch_blind_idiot_god:0 "The Blind Idiot God"
 eldritch_blind_idiot_god_desc:0 "Shells fall where the god's whim sends them, and its whim is always destruction."
 eldritch_blind_idiot_god_blasphemous_bombardment:0 "Blasphemous Bombardment"
 eldritch_blind_idiot_god_blasphemous_bombardment_desc:0 "The guns howl as they fire."
 eldritch_blind_idiot_god_primordial_fire:0 "Primordial Fire"
 eldritch_blind_idiot_god_primordial_fire_desc:0 "The shells burn with a light that was old before the sun."
 eldritch_blind_idiot_god_thing_at_the_centre:0 "The Thing at the Centre"
 eldritch_blind_idiot_god_thing_at_the_centre_desc:0 "Everything is drawn toward the chaos, and torn apart there."
 eldritch_blind_idiot_god_its_whim:0 "Its Whim"
 eldritch_blind_idiot_god_its_whim_desc:0 "Our men stop asking why, and keep fighting."

 # END DOCTRINES
